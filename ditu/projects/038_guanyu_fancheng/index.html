<script type="module">
// 关羽水淹七军 (樊城, 219 AD), 39.4 s — the fourth paragraph of the 038 narration.

const J = u => fetch(u).then(r => r.json()), B = u => fetch(u).then(r => r.arrayBuffer());

{

  ht.minFilter = ht.magFilter = THREE.LinearFilter; ht.wrapS = ht.wrapT = THREE.ClampToEdgeWrapping;

  fragmentShader: `uniform float uT, uMud, uAlpha, uLevel, uFogNear, uFogFar; uniform vec3 uColA, uColB, uFog;

const water = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), waterMat);
water.rotation.x = -Math.PI / 2; water.position.y = waterY(0); water.renderOrder = 1; scene.add(water);

const sun = new THREE.DirectionalLight(0xffe0b4, 3.0);
sun.position.set(-150, 62, -70); sun.target.position.set(0, 0, 0);
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x9fb0b8, 0x4a3626, 0.62); scene.add(hemi);

// ---------- ribbons: city walls, river edges ----------
const camera = new THREE.PerspectiveCamera(28, Wd / Ht, 2, 900);
const PIXK = 2 * Math.tan(THREE.MathUtils.degToRad(14)) / Ht;
const RIB_V = `attribute float aSide; attribute vec3 aNorm; attribute float aAlong;
  uniform float wW, pxW, pixK; varying float vSide, vAlong; varying vec3 vW;
  void main(){ vec4 wp = modelMatrix * vec4(position, 1.); float pw = length(cameraPosition - wp.xyz) * pixK;
    float hw = max(wW * .5, pxW * .5 * pw); wp.xyz += aNorm * aSide * hw; vSide = aSide; vAlong = aAlong; vW = wp.xyz;

  void main(){

const smooth = (pts, n) => new THREE.CatmullRomCurve3(pts, false, 'centripetal').getSpacedPoints(n);

// ---------- the fleet: five boats riding the river down from the north-west ----------

const DROPS = Array.from({ length: 220 }, (_, i) => { const r = mulberry32(900 + i); return [r(), r(), .55 + r() * .75, 12 + r() * 22]; });
function rain(t) {
  const amt = ss(seg(t, 20.9, 22.4)) * (1 - ss(seg(t, 29.4, 32.6)) * .7); if (amt <= .02) return;
  const n = Math.floor(DROPS.length * amt), tilt = .16, sp = 1500;
  g.save(); g.lineWidth = 1.1; g.strokeStyle = 'rgba(206,222,232,.34)';
  for (let i = 0; i < n; i++) {
    const [a, b, spd, len] = DROPS[i];
    const x = (a * Wd + t * 44) % (Wd + 120) - 60;
    const y = (b * Ht + t * sp * spd) % (Ht + 130) - 60;
    g.globalAlpha = .55 * amt * (i % 7 === 0 ? .5 : 1);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len * tilt, y + len); g.stroke();
  }
  g.restore();
  // a few heavier streaks to read as a downpour, not a drizzle

    g.save(); g.lineWidth = 2.2; g.strokeStyle = 'rgba(222,236,244,.34)';
    for (let i = 0; i < 18; i++) {
      const [a, b] = DROPS[i * 3];

  }
}

  hemi.intensity = .62 + rainy * .12;

  // city walls appear with their names
  for (const w of walls) { const k = eio(seg(t, w.t0, w.t0 + 1.4)); rv(w.glow, { revB: k * w.glow.L, inten: ss(seg(t, w.t0, w.t0 + .4)) }); rv(w.core, { revB: k * w.core.L, inten: ss(seg(t, w.t0, w.t0 + .4)) * .8, head: k * w.core.L, headAmt: .9 }); }

  // the camp rises with the armies, and is taken at the end
  const ck = ss(seg(t, 11.0, 12.6));
  for (const o of [tents, carts, men, arms]) o.scale.setScalar(.001 + ck);
  const take = ss(seg(t, 36.2, 37.3));
  MAT.tent.color.setRGB(.91 - .24 * take, .86 - .18 * take, .76 - .30 * take);
  MAT.tent.emissiveIntensity = .55 + take * .35;

  // boats run down from the north-west
  const bp = ss(seg(t, 27.4, 36.4));
  const vis = ss(seg(t, 27.0, 28.4));
  for (let i = 0; i < boats.length; i++) {
    const b = boats[i];
    const s = (.10 + bp * .62 + b.off) * rivS[rivS.length - 1];
    const q = onRiver(s, waterY(t) + .026);
    b.g.position.copy(q.p); b.g.rotation.y = Math.atan2(q.dir.x, q.dir.z);
    b.g.visible = vis > .02; b.g.scale.setScalar(3.4 * (1 - i * .06) * (i % 2 ? .82 : 1));
    const w = wakes[i];
    const s0 = clamp(s - .05 * rivS[rivS.length - 1], 0, rivS[rivS.length - 1]);
    rv(w, { revA: 0, revB: s0 * (w.L / rivS[rivS.length - 1]), inten: vis * .7 * (1 - i * .12) });
  }
  flagMat.opacity = ss(seg(t, 33.4, 34.2)) * (1 - ss(seg(t, 36.6, 37.4)));
  flag.visible = flagMat.opacity > .02;

  post.dof.focus = dist; post.dof.aper = dist * 2.2;
  VU.fade.value = 1;
  post.composer.render();

  rain(t);
  mapLabels(t); heightBar(t); pangDe(t); arrows(t);
  title(t); armyPlate(t); oathPlate(t); floodPlate(t); takenPlate(t);
  if (!Q.has('nosubs')) subtitles(t);
  credits(t);
}

window.DUR = T1 - T0;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
window.EV = EVF.map(e => ({ ...e, t: e.t - T0 })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
</body></html>

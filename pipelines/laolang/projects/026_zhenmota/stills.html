<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>镇魔塔 · 全片代表静帧 10 张</title>
<style>html,body{margin:0;background:#0b0a08}#stage{position:relative;overflow:hidden}</style>
<script src="lib/core.js"></script>
<script src="lib/promo.js"></script>
<script src="lib/goldenage.js"></script>
<script src="lib/cel.js"></script>
<script src="lib/laolang.js"></script>
<script src="lib/toon.js"></script>
<script src="lib/cast-lite.js"></script>
<script src="lib/act.js"></script>
<script src="lao_cast_full.js"></script>
<script src="lao_poses.js"></script>
</head><body><div id="stage"></div><script>
// 镇魔塔 · 全片代表静帧 10 张
// 画法 = 上美影 1980 赛璐璐动画的绘景底：水粉/水彩 wash、干笔、石纹裂纹、宣纸颗粒、手绘墨线。
// 人物/动作 = LAO_FULL 定稿造型 + LAO_POSE 定稿动作，绘在绘景之上，再交给管线胶片颗粒统一。
// 画面上不写任何字（brief/storyboard 的文案不属于本片，不臆造）。
const OUTFITS = window.LAO_FULL;

PROMO.compose({
  bpm: 84, offset: 0, grain: false, tail: 0.2, duration: 10,
  theme: { bg: '#14110d', fg: '#efe3c4', ink: '#efe3c4', muted: '#b7a98a', accent: '#b23a2b', paper: '#14110d', fonts: { display: '"KaiTi", "SimSun", serif', serif: '"SimSun", serif', sans: '"Microsoft YaHei", sans-serif' } },
  captions: { max: 18, font: '"SimSun", serif', weight: 500 },
  build: (F) => {
    const G = PROMO.laolang(F, {
      seed: 'zm-stills',
      captions: { max: 18, size: 24 },
      // 整帧当一张赛璐璐片洗印：描墨线 → 拷贝片调色 → 纸纹颜料颗粒
      post: (c) => CEL.frame(c, { seed: 11, exp: 1.04, gamma: 0.90, con: 1.06, sat: 1.05, tooth: 0.100, wobble: 0.55, inkThr: 7, inkAmt: 0.60 }),
    });
    const L = G.lib, lao = L.lao, W = G.W, H = G.H, RS = G.RS;
    const { camPush, clamp, lerp, F: inkFill, pEll, xfDraw } = L;
    const PAL = lao.PAL, rgba = lao.rgba;
    const TAU = Math.PI * 2, PI = Math.PI;

    /* =========================================================
       绘景工具箱（与 laolang.js 同一套画法）：
       每张底先在离屏画布上按设备分辨率画一遍，再随相机整体飞。
       ========================================================= */
    let prn = 20261111;
    const rnd = () => { prn = (prn * 16807) % 2147483647; return prn / 2147483647; };
    const rs = (n) => { prn = (n * 7919 + 13) % 2147483647 || 7; };
    const rr = (a, b) => a + (b - a) * rnd();
    const hseed = (s) => { let h = 17; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 2147483647; return h; };
    const pathIn = (x, pts, close = true) => {
      const n = pts.length / 2 | 0;
      if (n < 2) return;
      const g = (i) => [pts[2 * ((i + n) % n)], pts[2 * ((i + n) % n) + 1]];
      if (close) {
        const a = g(0), b = g(n - 1);
        x.beginPath(); x.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
        for (let i = 0; i < n; i++) { const c0 = g(i), c1 = g(i + 1); x.quadraticCurveTo(c0[0], c0[1], (c0[0] + c1[0]) / 2, (c0[1] + c1[1]) / 2); }
        x.closePath();
      } else {
        x.beginPath(); x.moveTo(pts[0], pts[1]);
        for (let i = 1; i < n; i++) x.lineTo(pts[2 * i], pts[2 * i + 1]);
      }
    };
    const sub = (pts, n = 5) => {
      const m = pts.length / 2 | 0, o = [];
      for (let i = 0; i < m; i++) {
        const ax = pts[2 * i], ay = pts[2 * i + 1], bx = pts[2 * ((i + 1) % m)], by = pts[2 * ((i + 1) % m) + 1];
        for (let k = 0; k < n; k++) { const u = k / n; o.push(ax + (bx - ax) * u, ay + (by - ay) * u); }
      }
      return o;
    };
    const paint = (x, pts, fill, stroke = PAL.ink, lw = 1.4, alpha = 1) => {
      // 先把每条边细分：平滑只切小圆角，矩形才不会变成鹅蛋
      const n = pts.length / 2 | 0;
      const p = n >= 3 ? sub(pts, n > 40 ? 1 : 4) : pts;
      x.save(); x.globalAlpha = alpha; pathIn(x, p, true);
      if (fill) { x.fillStyle = fill; x.fill(); }
      if (stroke && lw > 0) { x.strokeStyle = stroke; x.lineWidth = lw; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(); }
      x.restore();
    };
    const paintLine = (x, pts, stroke, lw = 1.6, alpha = 1, close = false) => {
      x.save(); x.globalAlpha = alpha; pathIn(x, pts, close); x.strokeStyle = stroke; x.lineWidth = lw; x.lineCap = 'round'; x.lineJoin = 'round'; x.stroke(); x.restore();
    };
    const wash = (x, x0, y0, w, h, stops, vert = true) => {
      const g = vert ? x.createLinearGradient(0, y0, 0, y0 + h) : x.createLinearGradient(x0, 0, x0 + w, 0);
      for (const s of stops) g.addColorStop(s[0], s[1]);
      x.fillStyle = g; x.fillRect(x0, y0, w, h);
    };
    const blob = (x, cx, cy, rx, ry, col, a = 0.2, n = 7) => {
      const pts = [];
      for (let i = 0; i < n; i++) { const an = i / n * TAU; const k = 0.72 + rnd() * 0.5; pts.push(cx + Math.cos(an) * rx * k, cy + Math.sin(an) * ry * k); }
      x.save(); x.globalAlpha = a; pathIn(x, pts, true); x.fillStyle = col; x.fill(); x.restore();
    };
    const dots = (x, x0, y0, w, h, n, col, a = 0.25, r0 = 0.5, r1 = 2) => {
      x.save(); x.fillStyle = col;
      for (let i = 0; i < n; i++) { x.globalAlpha = a * rr(0.3, 1); x.beginPath(); x.arc(x0 + rnd() * w, y0 + rnd() * h, rr(r0, r1), 0, TAU); x.fill(); }
      x.restore();
    };
    const dry = (x, x0, y0, x1, y1, w, col, n = 8, a = 0.12) => {
      x.save(); x.strokeStyle = col; x.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        x.globalAlpha = a * rr(0.4, 1.2); x.lineWidth = w * rr(0.4, 1.1);
        const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l, o = rr(-w, w);
        x.beginPath(); x.moveTo(x0 + nx * o, y0 + ny * o);
        x.quadraticCurveTo((x0 + x1) / 2 + nx * (o + rr(-3, 3)), (y0 + y1) / 2 + ny * (o + rr(-3, 3)), x1 + nx * o, y1 + ny * o);
        x.stroke();
      }
      x.restore();
    };
    const crack = (x, x0, y0, x1, y1, col = rgba(PAL.ink, 0.45), lw = 1) => {
      const n = 5, pts = [];
      for (let i = 0; i <= n; i++) { const u = i / n; pts.push(x0 + (x1 - x0) * u + rr(-5, 5), y0 + (y1 - y0) * u + rr(-4, 4)); }
      paintLine(x, pts, col, lw, 1, false);
    };
    const leaf = (x, cx, cy, rx, ry, col, stroke = PAL.inkBlue, a = 0.9) => paint(x, [cx - rx, cy, cx, cy - ry, cx + rx, cy, cx, cy + ry * 0.7], col, stroke, 0.9, a);
    /* 远山：不是一个色块剪影。脊线分远近、山体顺着走势扫干笔、山脚压一条雾带。
       越远的山越淡越偏青，越近的才有重轮廓 —— 空气透视是画出来的，不是调色调出来的。 */
    // 同一套山脊控制点在四个外景里平移缩放，四个远景就长得一模一样。
    // 逐场把控制点沿正弦错开几像素：轮廓还是一条手画的山，但不是同一座。
    const warpPts = (pts, k) => {
      const out = pts.slice(), n = out.length / 2;
      for (let i = 0; i < n; i++) {
        const u = n > 1 ? i / (n - 1) : 0;
        out[i * 2]     += Math.sin(u * 5.1 + k * 6.3) * 11 + Math.sin(u * 11.7 + k * 2.1) * 4;
        out[i * 2 + 1] += Math.sin(u * 3.7 + k * 4.9) * 8 + Math.cos(u * 8.3 + k * 1.7) * 5;
      }
      return out;
    };
    const ridgeP = (x, pts, o = {}) => {
      const yTop = o.yTop ?? 300, yBot = o.yBot ?? 520;
      const g = x.createLinearGradient(0, yTop, 0, yBot);
      g.addColorStop(0, o.top); g.addColorStop(0.62, o.mid || o.top); g.addColorStop(1, o.bot);
      paint(x, sub(pts, 6), g, o.ink === false ? null : rgba(o.inkCol || PAL.teal0, o.ink ?? .4), o.lw ?? 1.8);
      const hi = o.hi || PAL.cream, dk = o.dk || PAL.teal1;
      for (let i = 0; i < (o.brush ?? 46); i++) {
        const px = rr(-50, 1010), py = rr(yTop + 8, yBot - 6);
        dry(x, px, py, px + rr(26, 120), py + rr(-5, 5), rr(3, 10), i % 3 ? hi : dk, 2, o.a ?? .10);
      }
      for (let i = 0; i < (o.dabs ?? 16); i++) blob(x, rr(-30, 990), rr(yTop + 12, yBot - 8), rr(26, 86), rr(6, 20), dk, o.da ?? .13, 9);
      for (let i = 0; i < (o.labs ?? 10); i++) blob(x, rr(-30, 990), rr(yTop + 6, yBot * .5 + yTop * .5), rr(20, 60), rr(5, 14), hi, (o.la ?? .10), 9);
      if (o.fog !== false) {
        const fg = x.createLinearGradient(0, yBot - (o.fh ?? 34), 0, yBot + 4);
        fg.addColorStop(0, rgba(o.fogCol || PAL.cream, 0)); fg.addColorStop(1, rgba(o.fogCol || PAL.cream, o.fa ?? .46));
        x.fillStyle = fg; x.fillRect(-50, yBot - (o.fh ?? 34), 1060, (o.fh ?? 34) + 8);
      }
    };
    const tree = (x, bx, by, s, trunk = '#4a3a2a', leafCol = PAL.olive1) => {
      x.save(); x.translate(bx, by); x.scale(s, s);
      paintLine(x, [0, 6, -12, -90, 2, -170, -8, -250], trunk, 18, .95);
      paintLine(x, [-4, -120, -40, -168, -56, -210], trunk, 8, .9);
      paintLine(x, [0, -170, 40, -210, 56, -252], trunk, 7, .9);
      paintLine(x, [-3, 4, -13, -88, 1, -168], mixHex(trunk, PAL.cream, .35), 3.0, .55);
      // 树冠是画出来的一团色，不是一摞菱形贴片：暗底 → 中间调 → 左上受光
      const dark = mixHex(leafCol, '#141d18', 0.58), lit = mixHex(leafCol, PAL.cream, 0.34);
      const crowns = [[-44, -226, 48, 32], [10, -262, 60, 36], [56, -220, 42, 28]];
      for (const [cx2, cy2, rx, ry] of crowns) {
        for (let i = 0; i < 14; i++) blob(x, cx2 + rr(-rx, rx) * .92, cy2 + rr(-ry, ry) * .74, rr(16, 34), rr(12, 24), dark, .92, 9);
        for (let i = 0; i < 16; i++) blob(x, cx2 + rr(-rx, rx), cy2 + rr(-ry, ry) * .85, rr(12, 28), rr(9, 20), leafCol, .94, 9);
        for (let i = 0; i < 6; i++) blob(x, cx2 + rr(-rx, rx * .1), cy2 + rr(-ry, -ry * .1), rr(8, 18), rr(5, 12), lit, .82, 8);
      }
      // 叶团里点深色小簇：树冠内部有层次，不是一块果冻
      for (let i = 0; i < 26; i++) { const a2 = rr(0, TAU), r2 = rr(0, 66); blob(x, 8 + Math.cos(a2) * r2, -232 + Math.sin(a2) * r2 * .62, rr(3, 8), rr(2, 5), dark, .55, 6); }
      for (let i = 0; i < 14; i++) { const a2 = rr(0, TAU), r2 = rr(0, 58); blob(x, 8 + Math.cos(a2) * r2, -232 + Math.sin(a2) * r2 * .62, rr(2, 5), rr(1.5, 4), lit, .45, 6); }
      // 只在轮廓上点几片叶子，给边缘一点毛
      for (let i = 0; i < 12; i++) {
        const an = rr(0, TAU), rr0 = rr(46, 82);
        leaf(x, rr(-20, 76) + Math.cos(an) * rr0, -226 + Math.sin(an) * rr0 * .6, rr(4, 8), rr(6, 12), i % 2 ? leafCol : lit, PAL.inkBlue, .85);
      }
      x.restore();
    };
    // 垂柳：一根横枝 + 下垂的柳丝，柳丝上挂叶簇（不是珠子）
    const willowP = (x, cx, cy, s = 1, dark = PAL.olive0) => {
      paintLine(x, [cx - 60 * s, cy - 6 * s, cx + 20 * s, cy + 6 * s, cx + 110 * s, cy + 26 * s], '#4a3524', 15 * s, .95);
      for (let i = 0; i < 9; i++) {
        const bx = cx + rr(-10, 120) * s, by = cy + rr(-2, 28) * s;
        const len = rr(110, 210) * s;
        paintLine(x, [bx, by, bx + rr(-14, 6) * s, by + len * .5, bx + rr(-24, 4) * s, by + len], dark, rr(1.3, 2.4) * s, .85);
        for (let k = 0; k < 7; k++) {
          const u = rr(.25, 1);
          leaf(x, bx + rr(-12, 4) * s, by + len * u, rr(3, 6) * s, rr(7, 14) * s, k % 3 ? PAL.olive1 : PAL.olive2, PAL.inkBlue, .85);
        }
      }
    };
    // 自动描墨线：把绘景里的大形体边缘勾出来（上美影绘景的墨线骨架）
    // 只在亮度梯度足够强的地方落笔，笔触随机断续，避免变成照片滤镜
    const inkEdges = (c, thr = 30, amt = 0.6) => {
      const x = c.getContext('2d'), w = c.width, h = c.height;
      const im = x.getImageData(0, 0, w, h), d = im.data;
      const lum = new Float32Array(w * h);
      for (let p = 0, i = 0; p < w * h; p++, i += 4) lum[p] = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
      for (let y = 1; y < h - 1; y++) {
        for (let xx = 1; xx < w - 1; xx++) {
          const p = y * w + xx;
          const g = Math.abs(lum[p + 1] - lum[p - 1]) + Math.abs(lum[p + w] - lum[p - w]);
          if (g <= thr) continue;
          const a = Math.min(0.48, (g - thr) / 130) * amt;
          const i = p * 4;
          d[i] = d[i] * (1 - a) + 22 * a;
          d[i + 1] = d[i + 1] * (1 - a) + 31 * a;
          d[i + 2] = d[i + 2] * (1 - a) + 27 * a;
        }
      }
      x.putImageData(im, 0, 0);
    };
    // 四周压暗：赛璐璐绘景常用的大暗角，把观众的视线按到中间
    // 压角要轻、要暖：八十年代的拷贝片四角是发黄的，不是数码暗角
    const vignette = (x, a = 0.42) => {
      const g = x.createRadialGradient(W / 2, H * 0.46, H * 0.34, W / 2, H * 0.52, W * 0.86);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.66, `rgba(62,44,28,${(a * 0.16).toFixed(3)})`);
      g.addColorStop(1, `rgba(56,38,24,${(a * 0.52).toFixed(3)})`);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      for (const s of [0, 1]) {
        const gg = x.createLinearGradient(s ? W : 0, 0, s ? W * 0.86 : W * 0.14, 0);
        gg.addColorStop(0, `rgba(56,38,24,${(a * 0.20).toFixed(3)})`); gg.addColorStop(1, 'rgba(56,38,24,0)');
        x.fillStyle = gg; x.fillRect(s ? W * 0.86 : 0, 0, W * 0.14, H);
      }
    };
    // 湿画法色带：打散整片渐变，但每带两头渐隐——硬边会变成扫描线
    const bandBreak = (x, yMax = 470) => {
      const cols = [[239, 227, 196], [48, 74, 70], [201, 162, 74], [30, 58, 56], [232, 205, 150], [110, 140, 126]];
      let y = -70, i = 0;
      while (y < yMax) {
        const h = rr(70, 150), a = rr(0.030, 0.075), c = cols[i % cols.length];
        const g = x.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        g.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`);
        g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        x.fillStyle = g; x.fillRect(-30, y, 1020, h);
        y += h * rr(0.55, 0.8); i++;
      }
    };
    // 提饱和、提对比：赛璐璐绘景的颜色是“干净的浓”，不是水洗过的灰
    const punch = (c, k = 1.06, sat = 1.16) => {
      const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data;
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        const r = d[i], g = d[i + 1], b = d[i + 2], l = r * 0.3 + g * 0.59 + b * 0.11;
        d[i] = clamp(l + (r - l) * sat, 0, 255) * k + 128 * (1 - k);
        d[i + 1] = clamp(l + (g - l) * sat, 0, 255) * k + 128 * (1 - k);
        d[i + 2] = clamp(l + (b - l) * sat, 0, 255) * k + 128 * (1 - k);
      }
      x.putImageData(im, 0, 0);
    };
    // 80 年代赛璐璐拷贝片的调子：颜色偏闷、反差收窄、暗部泛青、亮部留暖
    const filmTone = (c) => {
      const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), d = im.data;
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        let r = d[i], g = d[i + 1], b = d[i + 2];
        const l = (r * 0.3 + g * 0.59 + b * 0.11) / 255;
        r = 8 + r * 0.80; g = 12 + g * 0.86; b = 12 + b * 0.82;
        r += -4 * (1 - l) + 9 * l;
        g += 5 * (1 - l) + 2 * l;
        b += 5 * (1 - l) - 6 * l;
        d[i] = clamp(r, 0, 255); d[i + 1] = clamp(g, 0, 255); d[i + 2] = clamp(b, 0, 255);
      }
      x.putImageData(im, 0, 0);
    };
    const paperize = (c, amt = 0.10, sd = 7) => {
      const x = c.getContext('2d'), w = c.width, h = c.height, im = x.getImageData(0, 0, w, h), d = im.data;
      let a = (sd * 2654435761) >>> 0;
      const r = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] === 0) continue;
        const n = (r() - 0.5) * 255 * amt;
        d[i] = clamp(d[i] + n * 1.12, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n * 0.82, 0, 255);
      }
      x.putImageData(im, 0, 0);
      x.save(); x.globalAlpha = 0.035; x.strokeStyle = '#2a211a';
      for (let i = 0; i < 1400; i++) { const yy = r() * h, xx = r() * w, l = 3 + r() * 18; x.lineWidth = 0.4 + r() * 0.8; x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx + l, yy + (r() - 0.5) * 1.2); x.stroke(); }
      x.restore();
    };
    const PC = {};
    const plate = (name, fn, amt = 0.09) => {
      if (!PC[name]) {
        rs(hseed(name));
        const c = document.createElement('canvas');
        c.width = Math.round(W * RS); c.height = Math.round(H * RS);
        const x = c.getContext('2d'); x.scale(RS, RS);
        fn(x);
        // 1. 墨线勾形（全局还会再描一次，这里只留骨架）  2. 平色带破渐变  3. 全局明暗  4. 暗角  5. 颜料颗粒  6. 纸纹
        inkEdges(c, 26, 0.20);
        bandBreak(x, 470);
        // 水粉笔触：横向长笔刷过天空，平涂渐变变成手刷的
        CEL.brush(x, -30, -30, 1020, 500, 160, ['#efe3c4', '#7e9a7c', '#d3aa63', '#2c5450', '#e6c98d'], { a: 0.110, dir: 0, len: 1.35, wid: 2.8, seed: hseed(name) + 5 });
        // 下半幅：斜向的干笔，地面/墙/道具不是一片平涂

    const scene9 = (t) => {

        for (let i = 0; i < 40; i++) { const yy = 476 + (i * 13) % 258; dry(x, -40, yy, 1000, yy + rr(-2, 2), rr(2, 6), PAL.cream, 3, .08); }

      for (let i = 0; i < 16; i++) {

    };

    /* ---------------- 一条 10 秒的片子，每秒一张 ---------------- */
    const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9, scene10];
    const CAM = [

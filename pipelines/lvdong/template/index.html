<!doctype html>
<html><head><meta charset="utf-8">
<title>剪影律动 · {{TITLE}}</title>
<style>
  /* 字体走仓库内 assets/fonts，缺文件时退到系统字体；不依赖任何外部目录 */
  @font-face { font-family: 'SCBold'; src: local('Microsoft YaHei'), local('Source Han Sans SC'), url('/assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'Anton'; src: local('Arial Black'), local('Arial'), url('/assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  #g { z-index: 1 } #o { z-index: 2; pointer-events: none }
</style></head>
<body>
<canvas id="g"></canvas>
<canvas id="o"></canvas>
<script src="styles/sky.js"></script>
<script src="cast.js"></script>
<script src="film.js"></script>
<script>
// 抓帧器协议：__ready / renderAt（film.js 里已有 READY / render）
window.renderAt = (t) => window.render(t);
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>玄奘 · 一分钟样片 · toon × laolang</title>
<style>html,body{margin:0;background:#0b0a08}#stage{position:relative;overflow:hidden}</style>
<script src="timeline.js"></script>
<script src="lib/core.js"></script>
<script src="lib/promo.js"></script>
<script src="lib/goldenage.js"></script>
<script src="lib/laolang.js"></script>

</head><body><div id="stage"></div><script>
// 玄奘 · 一分钟样片（0–62.2 s）· 1980 上美影《老狼请客》式绘景 + 定稿人物/动作库
// 绘景、片门、颗粒、青绿/赭黄色板沿用 laolang；人物用 claude-animated-shorts 的 toon.ts
// 身体/表情系统重画（长鼻、大眼、重眉、夸张嘴），cast.ts 的眨眼时钟，story.ts 的镜头/动作对白同步。
const { M } = PROMO;
const OUTFITS = window.LAO_FULL;

PROMO.compose({
  bpm: 84, offset: 0, grain: false, tail: 0.2,
  theme: { bg: '#14110d', fg: '#efe3c4', ink: '#efe3c4', muted: '#b7a98a', accent: '#b23a2b', paper: '#14110d', fonts: { display: '"Ma Shan Zheng", "KaiTi", serif', serif: '"Noto Serif SC", "SimSun", serif', sans: '"Noto Sans SC", "Microsoft YaHei", sans-serif' } },
  captions: { max: 18, font: '"Noto Serif SC", "SimSun", serif', weight: 500 },
  build: (F) => {
    const G = PROMO.laolang(F, { seed: 'xz-toon-lao', boil: 0.04, drawings: 30, captions: { max: 18, size: 37 } });
    const L = G.lib, lao = L.lao, W = G.W, H = G.H, ACT = window.ACT, ST = window.STORY;
    const { camPush, pop, clamp, lerp, K, F: inkFill } = L;
    const TAU = Math.PI * 2;
    const S = 0.26;                       // 1000 design units = 260 world units
    const SW = 170 * S;                   // one toon step in world units (legs are half length now)
    const A = ST.ACTS;
    const TL = window.TIMELINE;
    const cue = (line, ch) => {
      const l = TL.lines.find((x) => x.id === line);
      if (!l) return 0;
      const w = (l.words || []).find((x) => x.text.includes(ch));
      return w ? w.start : l.start;
    };
    const w2 = (t, at, dur) => { const u = clamp((t - at) / Math.max(0.001, dur), 0, 1); return u * u * (3 - 2 * u); };
    const C = {
      real: cue('l9', '真'), tang: cue('l10', '唐'), self: cue('l11', '自'),
      name: cue('l12', '石'), kneel: cue('l13', '跪'), caves: cue('l14', '窟'),
      five: cue('l15', '五'), night: cue('l16', '夜'), walk: cue('l16', '走'),
      shi: cue('l17', '石'), stop: cue('l18', '停'), sheathe: cue('l18', '收'),
      morn: cue('l19', '早'), die: cue('l19', '死'),
    };

    const shadow = (x, y, s, a = 0.26) => inkFill(L.pEll(x, y + 2, 26 * s, 5.5 * s, 0, TAU, 16), `rgba(40,30,20,${a})`);
    const actor = (slot, x, gy, s, opts, side = true, dir = 1) => {
      const c = CAST.draw(slot, OUTFITS[slot], opts, side);
      L.push(); L.tr(x, gy); if (dir < 0) L.scl(-1, 1);
      L.xfDraw(c, -300 * s, -975 * s, 600 * s, 1000 * s);
      L.pop();
    };
    // a side actor facing right; the face is toon.ts bodySide + our lao face overlay
    const side = (slot, x, gy, s, opts) => actor(slot, x, gy, s, opts, true, 1);
    const front = (slot, x, gy, s, opts) => actor(slot, x, gy, s, opts, false, 1);
    const sideL = (slot, x, gy, s, opts) => actor(slot, x, gy, s, opts, true, -1);

    // ---- 1 · walk to the door ----
    const wLead = ACT.walkCurve({ t0: 1.15, t1: 2.85, x0: 386, x1: 520, L0: SW * 2, phEnd: 0.25 });
    const wNote = ACT.walkCurve({ t0: 1.40, t1: 2.98, x0: 300, x1: 452, L0: SW * 2, phEnd: 0.15 });
    const wDig  = ACT.walkCurve({ t0: 1.65, t1: 3.08, x0: 212, x1: 374, L0: SW * 2, phEnd: 0.35 });
    const WALKERS = [wLead, wNote, wDig];
    const steps = ACT.footfalls(WALKERS, 0, 3.2);

    G.shot(0, 4.15, (u, t) => {
      camPush(K(t, [[0, 492], [2.6, 512], [4.15, 545]]), K(t, [[0, 440], [4.15, 460]]), K(t, [[0, 1.10], [2.6, 1.14], [4.15, 1.18]]));
      L.xfDraw(lao.cliff(), 0, 0, W, H);
      inkFill([0, 0, W, 0, W, H, 0, H], 'rgba(8,26,26,.16)');
      motes(t, 12, 120, 760, 180, 620, '245,222,168', 0.09);
      lao.door(t, A.push + 0.02, 0.72);
      const push = clamp(ST.win(t, A.push + 0.02, 0.3) - ST.win(t, 3.7, 0.35), 0, 1);
      const seeIn = ST.win(t, A.push + 0.45, 0.5);
      const up = ST.win(t, 2.3, 0.4);
      for (let i = 2; i >= 0; i--) {
        const w = WALKERS[i](t);
        const stop = w.stop;
        const mode = i === 0 && stop > 0.8 ? 'push' : stop > 0.8 ? 'stand' : 'march';
        const expr = i === 0 ? (seeIn > 0.35 ? 'shock' : up > 0.5 ? 'nervous' : 'neutral') : stop > 0.8 ? 'neutral' : 'neutral';
        const o = {
          phase: w.ph, mode, expr, blink: CAST.lidAt(t, i, [A.push]),
          stride: 1, stomp: 1, pose: i === 0 ? push * 0.62 : 0,
          light: -110, seed: i + 1,
        };
        const gy = 676 + (i === 2 ? 4 : 0);
        const s = i === 0 ? S : i === 1 ? S * 0.96 : S * 1.02;
        shadow(w.x, gy, s);
        side(i, w.x, gy, s, o);
      }
      // dust at the threshold
      if (t > 2.9) {
        const d = clamp((t - 2.9) / 1.1, 0, 1);
        for (let i = 0; i < 8; i++) {
          const px = 560 + Math.sin(i * 2.1 + t * 1.3) * (16 + i * 2) * d;
          const py = 652 - (i % 4) * 6 - d * (8 + i * 2);
          inkFill(L.pEll(px, py, 16 + i * 2, 7 + i, 0, TAU, 12), `rgba(214,178,116,${0.05 + 0.03 * (i % 3)})`);
        }
      }
      // foreground cave rock and branch frame the entrance
      inkFill([0, 690, 120, 662, 230, 688, 280, 720, 0, 720], 'rgba(8,7,5,.80)');
      const dbw = Math.sin(t * 1.15 + 0.6) * 3;
      L.L([960, 0, 910 + dbw * 0.5, 70, 872 + dbw, 150, 842 + dbw * 1.4, 230], 8, '#0b0806', { taper: 0.2 });
      for (let i = 0; i < 8; i++) inkFill(L.pEll(850 + (i * 13) % 80 + dbw * (0.4 + (i % 3) * 0.3), 60 + (i * 21) % 160, 10, 6, 0, TAU, 10), '#1b3528');
      glow(714, 470, 18, 86, '240,160,70', 0.08, 8);
      pop();
    });

    // ---- 2 · read the mural ----
    G.shot(4.15, 8.56, (u, t) => {
      const cam = K(t, [
        [4.15, { x: 470, y: 332, z: 1.0 }],
        [4.95, { x: 310, y: 335, z: 1.24 }],
        [5.62, { x: 500, y: 336, z: 1.26 }],
        [6.55, { x: 714, y: 336, z: 1.28 }],
        [7.95, { x: 714, y: 411, z: 2.35 }],
        [8.56, { x: 714, y: 411, z: 2.4 }],
      ]);
      camPush(cam.x, cam.y, cam.z);
      L.xfDraw(lao.mural(), 0, 0, W, H);
      lao.muralScene(t, { monkTurn: 0, apeTurn: 0, look: 0, grin: 0, blink: 0 });
      const gl = ST.win(t, A.ring + 0.05, 0.4) * (0.8 + 0.2 * Math.sin(t * 9));
      if (gl > 0.01) {
        inkFill(L.pEll(714, 411, 30 + 8 * gl, 30 + 8 * gl, 0, TAU, 24), `rgba(240,207,122,${0.11 * gl})`);
        inkFill(L.pEll(714, 411, 14, 14, 0, TAU, 18), `rgba(255,232,160,${0.18 * gl})`);
      }
      for (let i = 0; i < 18; i++) {
        const px = 120 + ((i * 137 + t * (6 + i % 5)) % 720), py = 260 + ((i * 83 + t * (4 + i % 3)) % 300);
        inkFill(L.pEll(px, py, 1.2 + (i % 3) * 0.5, 1.2 + (i % 3) * 0.5, 0, TAU, 6), `rgba(245,222,168,${0.08 + (i % 4) * 0.02})`);
      }
      pop();
    });

    // ---- 3a · three profiles go still ----
    G.pause(8.56, 9.22, { energy: 1, name: 'stunned', hit: false });
    G.shot(8.56, 9.22, (u, t) => {
      camPush(K(t, [[8.56, 402], [9.22, 430]]), 390, 1.20);
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 12, 220, 760, 300, 620, '245,222,168', 0.10);
      for (let i = 2; i >= 0; i--) {
        const x = 230 + i * 170, gy = 600;
        shadow(x, gy, 0.24);
        side(i, x, gy, 0.24, { phase: 0.25, mode: 'stand', expr: 'shock', blink: CAST.lidAt(t, i, [8.56]), light: -110, seed: i + 1 });
      }
      pop();
    });

    // ---- 3b · hold on the three profiles, then the film cuts to the wall ----
    G.shot(9.22, 10.8, (u, t) => {
      camPush(K(t, [[9.22, 480], [10.8, 510]]), K(t, [[9.22, 390], [10.8, 395]]), K(t, [[9.22, 1.14], [10.8, 1.20]]));
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 12, 220, 760, 300, 620, '245,222,168', 0.10);
      for (let i = 2; i >= 0; i--) {
        const x = 230 + i * 170, gy = 600;
        shadow(x, gy, 0.24);
        side(i, x, gy, 0.24, { phase: 0.25, mode: 'stand', expr: 'nervous', blink: CAST.lidAt(t, i, [9.22]), light: -110, seed: i + 1 });
      }
      pop();
    });

    // ---- 4 · the book, Ming ----
    G.shot(10.8, 14.14, (u, t) => {
      const z = K(t, [[10.8, 1.14], [14.14, 1.20]]);
      camPush(K(t, [[10.8, 690], [14.14, 700]]), 390, z);
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 10, 480, 900, 250, 560, '245,222,168', 0.10);
      // table and open book on the right
      inkFill([520, 548, 860, 548, 880, 566, 500, 566], '#6b4a2f');
      L.S([520, 548, 860, 548, 880, 566, 500, 566], '#6b4a2f', 2.2, 'rgba(42,33,26,.9)');
      L.L([540, 566, 530, 700], 3, '#4a3524'); L.L([850, 566, 860, 700], 3, '#4a3524');
      L.S([586, 506, 680, 498, 690, 552, 596, 558], '#efe3c4', 2, 'rgba(42,33,26,.9)');
      L.S([690, 498, 786, 508, 778, 560, 688, 552], '#e2d0a8', 2, 'rgba(42,33,26,.9)');
      L.L([690, 500, 690, 552], 2, 'rgba(42,33,26,.5)');
      for (let i = 0; i < 5; i++) L.L([606, 516 + i * 7, 676, 512 + i * 7], 1, 'rgba(74,58,40,.35)');
      inkFill(L.pRR(722, 512, 26, 26, 2, 4), 'rgba(168,55,44,.85)');
      side(1, 400, 600, 0.26, { phase: 0.1, mode: 'push', pose: 0.28, expr: 'neutral', blink: CAST.lidAt(t, 1), light: -110, seed: 2 });
      pop();
    });
    G.write('西游记', { x: 400, y: 556, size: 16, color: '#4a3a2c', at: A.book + 0.15, until: 14.1, kind: 'label' });
    G.write('明', { x: 540, y: 590, size: 14, color: '#efe3c4', at: A.ming + 0.1, until: 14.1, kind: 'label' });

    G.write('西游记 · 明', { x: 480, y: 120, size: 38, color: '#4a3a2c', at: 10.9, until: 14.1, kind: 'headline' });

    // ---- 5 · five hundred years ----
    G.shot(14.14, 15.55, (u, t) => {
      camPush(K(t, [[14.14, 600], [15.55, 585]]), 390, K(t, [[14.14, 1.12], [15.55, 1.08]]));
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 10, 240, 740, 300, 620, '245,222,168', 0.09);
      L.L([230, 330, 720, 330], 4, '#a8372c', { taper: 0.05 });
      inkFill(L.pEll(230, 330, 7, 7, 0, TAU, 12), '#a8372c');
      inkFill(L.pEll(720, 330, 7, 7, 0, TAU, 12), '#a8372c');
      side(2, 330, 600, 0.26, { phase: 0.1, mode: 'push', pose: 0.22, expr: 'nervous', blink: CAST.lidAt(t, 2), light: -110, seed: 3 });
      pop();
    });
    G.write('唐 · 五百年 · 明', { x: 475, y: 286, size: 30, color: '#4a3a2c', at: 14.22, until: 15.55, kind: 'label' });

    // ---- 6 · the question, then the one explanation ----
    G.shot(15.55, 19.08, (u, t) => {
      camPush(K(t, [[15.55, 690], [19.08, 700]]), 390, K(t, [[15.55, 1.16], [19.08, 1.20]]));
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 10, 220, 760, 300, 620, '245,222,168', 0.09);
      side(0, 390, 600, 0.26, { phase: 0.15, mode: 'push', pose: 0.2, expr: 'nervous', blink: CAST.lidAt(t, 0, [15.35]), light: -110, seed: 1 });
      pop();
    });
    G.write('?', { x: 500, y: 300, size: 92, color: '#a8372c', at: 16.1, until: 19.0, kind: 'headline', pop: true });

    G.shot(19.08, 20.24, (u, t) => {
      camPush(K(t, [[19.08, 690], [20.1, 714]]), 350, K(t, [[19.08, 1.70], [20.1, 1.85]]));
      L.xfDraw(lao.mural(), 0, 0, W, H);
      motes(t, 10, 620, 780, 260, 500, '245,222,168', 0.08);
      lao.muralScene(t, { monkTurn: 0.1, apeTurn: -0.14, look: 1, grin: 0.5, blink: 0 });
      pop();
    });

    G.write('玄奘', { x: 480, y: 160, size: 60, color: '#b23a2b', at: 19.15, until: 20.4, kind: 'headline', pop: true });
    

    // ================= 20.24–62.2 · 从壁画走进历史 =================
    const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const withA = (h, a) => { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
    const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`; };
    const gradY = (y0, y1, c0, c1, steps = 30) => {
      const A = hex2rgb(c0), B = hex2rgb(c1);
      for (let i = 0; i < steps; i++) {
        const t = (i + 0.5) / steps;
        const ya = y0 + (y1 - y0) * i / steps, yb = y0 + (y1 - y0) * (i + 1) / steps + 0.4;
        inkFill([0, ya, W, ya, W, yb, 0, yb], mix(c0, c1, t));
      }
    };
    const glow = (cx, cy, r0, r1, rgb, a, steps = 12) => {
      for (let i = steps; i >= 1; i--) {
        const t = i / steps, r = r0 + (r1 - r0) * t;
        inkFill(L.pEll(cx, cy, r, r, 0, TAU, 36), `rgba(${rgb},${(a * (1 - t) + 0.006).toFixed(3)})`);
      }
    };
    const cloudBand = (x, y, len, w, a) => {
      L.L([x, y, x + len * 0.3, y - 4, x + len * 0.7, y + 2, x + len, y - 1], w, `rgba(239,227,196,${a})`, { taper: 0.45 });
      L.L([x + len * 0.16, y + 8, x + len * 0.55, y + 4, x + len * 0.9, y + 7], w * 0.6, `rgba(239,227,196,${a * 0.7})`, { taper: 0.5 });
    };
    const bird = (x, y, s = 1, t = 0) => {
      const f = Math.sin(t * 3.6 + x * 0.05) * 2.2 * s;
      L.L([x - 6 * s, y, x, y - 4 * s + f, x + 6 * s, y], 1.4 * s, 'rgba(42,33,26,.42)', { taper: 0.3 });
      L.L([x + 2 * s, y + 1, x + 7 * s, y - 2 * s + f * 0.7, x + 12 * s, y + 1], 1.2 * s, 'rgba(42,33,26,.35)', { taper: 0.3 });
    };
    // 空气里的浮尘：缓慢上升、左右漂移，给静场一点呼吸
    const motes = (t, n = 16, x0 = 80, x1 = 880, y0 = 180, y1 = 660, rgb = '245,222,168', amax = 0.15) => {
      for (let i = 0; i < n; i++) {
        const px = x0 + ((i * 137 + t * (3 + (i % 5) * 1.2)) % (x1 - x0));
        const py = y1 - ((i * 83 + t * (4 + (i % 4) * 1.7)) % (y1 - y0));
        const a = 0.035 + (i % 4) * (amax / 4) + 0.015 * Math.sin(t * 1.3 + i);
        inkFill(L.pEll(px, py, 1.0 + (i % 3) * 0.55, 1.0 + (i % 2) * 0.5, 0, TAU, 6), `rgba(${rgb},${Math.max(0.02, a)})`);
      }
    };
    const desert = (mode, t = 0) => {
      const night = mode === 'night', dusk = mode === 'dusk', day = mode === 'day';
      const top = night ? '#081d22' : dusk ? '#2a1a20' : day ? '#153842' : '#123438';
      const mid = night ? '#163633' : dusk ? '#5a2e26' : day ? '#4a5a42' : '#3e5040';
      const hor = night ? '#234a46' : dusk ? '#9a4a2a' : day ? '#c9a25a' : '#c9974f';
      gradY(0, 330, top, mid, 24);
      gradY(330, 448, mid, hor, 12);
      // sun / moon：整片缓慢横移，外加极轻的呼吸
      const sx = (night ? 720 : 742) + Math.sin(t * 0.045) * 6 + (t - 40) * 3.6;
      const sy = (night ? 142 : 176) + Math.sin(t * 0.031 + 1.2) * 3 - (t - 40) * 0.30;
      const sunPulse = 0.9 + 0.1 * Math.sin(t * 0.7);
      glow(sx, sy, night ? 30 : 24, night ? 135 : 118, night ? '239,227,196' : '248,214,146', (night ? 0.08 : 0.09) * sunPulse, 12);
      inkFill(L.pEll(sx, sy, night ? 31 : 28, night ? 31 : 28, 0, TAU, 40), night ? '#efe3c4' : '#f6df9f');
      if (night) {
        for (const [ox, oy, rx, ry] of [[-9, -7, 7, 5], [8, 5, 5, 4], [-3, 10, 4, 3]]) inkFill(L.pEll(sx + ox, sy + oy, rx, ry, 0, TAU, 12), 'rgba(178,170,142,.22)');
        for (let i = 0; i < 46; i++) { const x = (i * 137 + 31) % W, y = 24 + (i * 83) % 270; if (Math.hypot(x - sx, y - sy) > 70) inkFill(L.pEll(x, y, 0.8 + (i % 3) * 0.5, 0.8 + (i % 3) * 0.4, 0, TAU, 6), `rgba(239,227,196,${0.22 + (i % 5) * 0.09})`); }
      }
      // painted cloud bands：横向慢慢漂
      for (let i = 0; i < 4; i++) cloudBand(40 + i * 55 + Math.sin(t * 0.06 + i) * 12 + t * 0.9, 96 + i * 34, 190 + (i % 3) * 70, 7, night ? 0.055 : 0.13);
      // far mountains, two cut-paper layers, with snow on the far peaks
      const m1 = [0, 410, 70, 344, 150, 372, 238, 316, 320, 356, 410, 300, 500, 348, 590, 306, 690, 354, 790, 312, 890, 352, 960, 330];
      L.S([...m1, 960, 470, 0, 470], night ? '#102a29' : dusk ? '#2a1c18' : day ? '#24403a' : '#1d3a36', 0, 'rgba(0,0,0,0)');
      if (!night) L.L(m1, 1.4, 'rgba(42,33,26,.35)', { taper: 0.2 });
      if (!night) {
        for (const [px, py] of [[238, 316], [410, 300], [590, 306], [790, 312]]) {
          inkFill([px - 13, py + 18, px - 2, py + 2, px, py - 2, px + 4, py + 4, px + 14, py + 19], day ? 'rgba(239,227,196,.55)' : 'rgba(239,227,196,.38)');
        }
      }
      const m2 = [0, 446, 90, 402, 190, 424, 300, 388, 420, 420, 540, 384, 670, 418, 800, 386, 920, 420, 960, 404];
      L.S([...m2, 960, 520, 0, 520], night ? '#0d2424' : dusk ? '#1e1412' : day ? '#1b3532' : '#162f2c', 0, 'rgba(0,0,0,0)');
      if (!night) L.L(m2, 1.2, 'rgba(42,33,26,.25)', { taper: 0.2 });
      // horizon haze
      L.S([0, 400, W, 400, W, 450, 0, 450], night ? 'rgba(120,160,150,.06)' : 'rgba(239,227,196,.12)', 0, 'rgba(0,0,0,0)');
      // five dune layers, each with a shadow side and a lit crest
      const d1 = [0, 448, 110, 432, 230, 446, 360, 422, 500, 440, 640, 420, 780, 436, 900, 422, 960, 430];
      if (!night)       L.S([...d1, 960, 540, 0, 540], night ? '#1a3a37' : '#8f6633', 0, 'rgba(0,0,0,0)');

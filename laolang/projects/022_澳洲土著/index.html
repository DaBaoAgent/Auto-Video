</head><body><div id="stage"></div><script>
// 022《会飞的中国人》· 全片（537.43 s）
// 第一幕已按分镜计划（review/shotplan.json，195 镜）重切：0–46.89 s 共 18 镜。
// 0–20.12 s 沿用已验收的 8 镜样片（切点 2.98 / 5.82 / 8.08 / 10.10 / 12.22 / 15.36 / 17.42）；
// 20.12 s 之后按计划继续：酒桌追问 → 后厨闪回 → 拆迁 → 阁楼老照片 → 报刊转场。
// 分镜按真实口播节拍切，每镜 2–4 秒；时间轴由全片配音转写重建（review/asr_*.json）。
// 绘景、片门、颗粒沿用 laolang；人物用 08_人物设定 审核通过的 CAST022。
// 屏幕文字只用 brief.md 表里的词。

const { M } = PROMO;

PROMO.compose({
  bpm: 84, offset: 0, grain: false, tail: 0,
  theme: { bg: '#14110d', fg: '#efe3c4', ink: '#efe3c4', muted: '#b7a98a', accent: '#b23a2b', paper: '#14110d', fonts: { display: '"Ma Shan Zheng", "KaiTi", serif', serif: '"Noto Serif SC", "SimSun", serif', sans: '"Noto Sans SC", "Microsoft YaHei", sans-serif' } },
  captions: { max: 18, font: '"Noto Serif SC", "SimSun", serif', weight: 500 },
  build: (F) => {
    const G = PROMO.laolang(F, { seed: 'pd-022-film', boil: 0.045, drawings: 30, captions: { max: 18, size: 37 } });
    const L = G.lib, W = G.W, H = G.H, ACT = window.ACT, CAST = window.CAST022;
    const { camPush, pop, clamp, lerp, K } = L;
    const TAU = Math.PI * 2;

    // ---------- palette ----------
    const INK = '#241726', INK2 = '#2a211a';
    const CREAM = '#efe3c4', CREAM2 = '#e2d0a8', CREAM3 = '#d5c092';
    const TEAL0 = '#1d403f', TEAL1 = '#2c5450', TEAL2 = '#3f6b60', TEAL3 = '#5d7f6d';
    const OLIVE1 = '#5f682b', OLIVE2 = '#7f8840';
    const OCHRE0 = '#6b4a2f', OCHRE1 = '#8f6633', OCHRE2 = '#b98a49', OCHRE3 = '#d3aa63';
    const RUST = '#a34c32', RUST2 = '#c06a45', GOLD = '#d8a53f', GOLD2 = '#f0cf7a';

    const hex2 = (h) => {
      h = String(h);
      if (h[0] === '#') { const n = h.slice(1); return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)]; }
      const m = h.match(/(\d+)\D+(\d+)\D+(\d+)/);
      return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
    };
    const mix2 = (a, b, u) => { const A = hex2(a), B = hex2(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * u)},${Math.round(A[1] + (B[1] - A[1]) * u)},${Math.round(A[2] + (B[2] - A[2]) * u)})`; };
    const rgba = (h, a) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };

    // ---------- drawing helpers (flat arrays, like the laolang plates) ----------
    const inkFill = (pts, col) => L.F(pts, col);
    const inkShape = (pts, fill, w = 2.4, col = INK) => L.S(pts, fill, w, col);
    const inkLine = (pts, w = 2.2, col = INK, o) => L.L(pts, w, col, o);
    const inkOutline = (pts, w = 2.2, col = INK) => L.L(pts, w, col, { closed: true });
    const inkEll = (cx, cy, rx, ry, fill, w = 2.2, col = INK) => {
      const p = L.pEll(cx, cy, rx, ry, 0, TAU, 36);
      if (fill) L.F(p, fill);
      if (w > 0) L.L(p, w, col, { closed: true });
    };
    const gradY = (y0, y1, c0, c1, steps = 26) => {
      for (let i = 0; i < steps; i++) {
        const ya = y0 + (y1 - y0) * i / steps, yb = y0 + (y1 - y0) * (i + 1) / steps + 0.5;
        inkFill([0, ya, W, ya, W, yb, 0, yb], mix2(c0, c1, (i + 0.5) / steps));
      }
    };
    const glow = (cx, cy, r0, r1, rgb, a, steps = 12) => {
      for (let i = steps; i >= 1; i--) {
        const t = i / steps, r = r0 + (r1 - r0) * t;
        inkFill(L.pEll(cx, cy, r, r, 0, TAU, 32), `rgba(${rgb},${(a * (1 - t) + 0.004).toFixed(3)})`);
      }
    };
    const motes = (t, n = 14, x0 = 80, x1 = 880, y0 = 140, y1 = 640, rgb = '245,222,168', amax = 0.12) => {
      for (let i = 0; i < n; i++) {
        const px = x0 + ((i * 137 + t * (3 + (i % 5) * 1.2)) % (x1 - x0));
        const py = y1 - ((i * 83 + t * (4 + (i % 4) * 1.7)) % (y1 - y0));
        const a = 0.03 + (i % 4) * (amax / 4) + 0.012 * Math.sin(t * 1.3 + i);
        inkFill(L.pEll(px, py, 1 + (i % 3) * 0.5, 1 + (i % 2) * 0.45, 0, TAU, 6), `rgba(${rgb},${Math.max(0.02, a)})`);
      }
    };
    // 旧报印刷网点：一格一格的墨点，密度随 alpha 变化（不用随机数，帧间稳定）
    const halftone = (t, a = 0.08, step = 26) => {
      for (let y = 10; y < 720; y += step) {
        for (let x = 10; x < 960; x += step) {
          const k = 0.55 + 0.45 * Math.sin(x * 0.031 + y * 0.047 + t * 0.4);
          const s = 1.1 + 1.5 * k;
          inkEll(x + ((y / step) % 2) * step * 0.5, y, s, s, `rgba(36,23,38,${(a * (0.4 + 0.6 * k)).toFixed(3)})`, 0);
        }
      }
    };
    const WIN = (t, at, dur) => ACT.windowAt(t, at, dur);
    const SMOOTH = (a, b, u) => { const q = clamp((u - a) / Math.max(1e-5, b - a), 0, 1); return q * q * (3 - 2 * q); };

    // ---------- cast ----------
    const actorSide = (id, x, gy, s, opts, dir = 1, sx = 1) => {
      const c = CAST.draw(id, opts, true);
      L.push(); L.tr(x, gy); L.scl(dir * sx, 1);
      L.xfDraw(c, -300 * s, -975 * s, 600 * s, 1000 * s);
      L.pop();
    };
    const actorFront = (id, x, gy, s, opts, sx = 1) => {
      const c = CAST.draw(id, opts, false);
      L.push(); L.tr(x, gy); L.scl(sx, 1);
      L.xfDraw(c, -300 * s, -975 * s, 600 * s, 1000 * s);
      L.pop();
    };

    // ---------- time ----------
    // real narration beats (rebuilt from the voiceover's word timings)
    const B_OUT = 2.98;      // 说起澳大利亚土著部落…
    const B_FLY = 5.82;      // 说九十年前…
    const B_ROAD = 8.08;     // 骑车从悉尼到墨尔本…
    const B_AIR = 10.10;     // 比开飞机来接他的人还快…
    const B_BACK = 12.22;    // 朋友听愣了…
    const B_ASK2 = 15.36;    // 是不是姓潘？
    const B_SLAMSHOT = 17.42;// 朋友一拍桌子…
    const B_ASK = B_BACK;    // 朋友听愣了…
    const B_QUOTE = 13.0;    // 说，你等等…
    const B_AGREE = 16.47;   // 驴友说对呀
    const SLAM = 17.94, SLAM_B = 18.14;   // 朋友一拍桌子
    // the picture holds for two tenths of a second at the slam: every action after it runs on shifted time
    const taOf = (t) => (t < SLAM ? t : t < SLAM_B ? SLAM : t - 0.2);
    const w04 = ACT.walkCurve({ t0: 0.22, t1: 2.30, x0: -90, x1: 330, L0: 88, phEnd: 0.12 });
    const X04 = 330, X05 = 620, GY04 = 705, GY05 = 718, S04 = 0.52;

    /* ============================================================
       1 · 沈家巷酒馆
       ============================================================ */
    const WALL_BLOBS = [[110, 300, 84, 52, .045], [300, 200, 120, 64, .04], [640, 270, 150, 80, .035], [820, 410, 110, 60, .04], [430, 430, 90, 44, .035]];
    const TABLE_GRAIN = [[196, 560, 300, 558], [330, 574, 470, 572], [520, 554, 700, 551], [640, 582, 840, 579], [240, 584, 360, 582]];

    function drawDoor(ta) {
      // a shikumen door at the left edge: stone frame, a lane at night
      inkShape([2, 148, 184, 140, 194, 714, -6, 722], '#7a6a4e', 3.5);
      inkShape([30, 178, 154, 172, 162, 698, 18, 704], '#0f2022', 0);
      inkFill([34, 500, 158, 496, 162, 696, 22, 700], '#14292a');
      inkFill([34, 178, 154, 172, 150, 250, 38, 256], 'rgba(6,14,15,.55)');
      inkEll(92, 300, 46, 128, 'rgba(120,150,140,.07)', 0);
      // street lamp out in the lane
      inkEll(104, 312, 9, 12, 'rgba(248,214,146,.85)', 0);
      glow(104, 312, 8, 46, '248,214,146', 0.18, 8);
      inkLine([104, 326, 104, 436], 4, '#2a211a');
      // stone lintel and sill
      inkShape([-2, 140, 186, 132, 190, 158, 0, 166], '#9a8a68', 3);
      inkShape([6, 690, 172, 684, 176, 712, 0, 716], '#9a8a68', 3);
      inkLine([16, 160, 176, 152], 1.8, 'rgba(239,227,196,.28)');
      // cold night spilling on the threshold
      inkFill([20, 690, 170, 684, 178, 720, 10, 720], 'rgba(93,127,109,.16)');
    }

    function drawWindow(ta) {
      const x0 = 712, y0 = 150, x1 = 910, y1 = 348;
      inkShape([x0 - 12, y0 - 12, x1 + 12, y0 - 14, x1 + 14, y1 + 12, x0 - 14, y1 + 10], '#4a3524', 3);
      inkShape([x0, y0, x1, y0, x1, y1, x0, y1], '#163633', 0);
      // the lane outside: tiled roofs and a pale moon
      inkFill([x0, y1 - 44, x0 + 70, y1 - 74, x1 - 34, y1 - 54, x1, y1 - 70, x1, y1, x0, y1], '#122a28');
      inkEll(854, 202, 17, 17, CREAM, 0);
      glow(854, 202, 9, 38, '239,227,196', 0.10, 8);
      // lattice
      for (let i = 1; i < 3; i++) {
        inkLine([x0 + (x1 - x0) * i / 3, y0, x0 + (x1 - x0) * i / 3, y1], 5, '#6b4a2f');
        inkLine([x0, y0 + (y1 - y0) * i / 3, x1, y0 + (y1 - y0) * i / 3], 5, '#6b4a2f');
      }
      // a paper patch and the warm room reflected on the glass
      inkShape([x0 + 14, y1 - 94, x0 + 54, y1 - 100, x0 + 58, y1 - 58, x0 + 18, y1 - 54], 'rgba(239,227,196,.16)', 0);
      inkEll(792, 248, 54, 62, 'rgba(248,214,146,.05)', 0);
      inkShape([x0 - 18, y1 + 8, x1 + 18, y1 + 8, x1 + 20, y1 + 22, x0 - 20, y1 + 22], '#6b4a2f', 2.6);
    }

    function drawHangings(ta) {
      // strung chilli and garlic on the ceiling beam, short enough to clear the wanderer's cap as he walks under
      const sw = Math.sin(ta * 0.7) * 1.5;
      inkLine([234, 118, 226 + sw, 184, 238 + sw, 280], 1.6, '#5a4632');
      for (let i = 0; i < 4; i++) inkEll(224 + sw + (i % 2) * 6, 186 + i * 20, 7, 14, RUST, 2, 'rgba(94,40,28,.95)');
      inkEll(264 + sw, 184, 9, 10, CREAM, 2);
      for (let i = 0; i < 3; i++) inkEll(264 + sw + (i % 2) * 5, 212 + i * 20, 11, 13, CREAM, 2);
    }

    function drawLamp(ta) {
      const sw = Math.sin(ta * 0.9) * 2.2, lx = 500 + sw, ly = 138;
      inkLine([500, 0, lx, ly], 2.2, INK2);
      inkShape([lx - 42, ly, lx + 42, ly, lx + 27, ly + 44, lx - 27, ly + 44], RUST, 3.2);
      inkLine([lx - 42, ly, lx + 42, ly], 3, '#8a3a2c');
      inkEll(lx, ly + 30, 32, 7, 'rgba(240,207,122,.18)', 0);
      const fl = 0.86 + 0.10 * Math.sin(ta * 7.3) + 0.04 * Math.sin(ta * 13.1);
      glow(lx, ly + 54, 7, 74, '248,214,146', 0.17 * fl, 10);
      inkEll(lx, ly + 54, 7, 9, GOLD2, 0);
      glow(lx, ly + 64, 40, 236, '248,214,146', 0.05 * fl, 10);
      inkLine([lx, ly + 44, lx + 1, ly + 52], 1.6, '#8a3a2c');
      inkEll(lx, ly + 56, 3, 6, 'rgba(248,214,146,.8)', 0);
    }

    function draw04(ta, forceExpr) {
      const w = w04(ta);
      const moving = w.stop < 0.96;
      const mode = moving ? 'march' : 'stand';
      const expr = forceExpr || (ta < 2.35 ? (ta > 1.15 ? 'curious' : 'neutral')
        : ta < 18.45 ? (ta >= B_AGREE && ta < 18.45 ? 'smile' : 'neutral')
        : 'shock');
      const lean = 3 * WIN(ta, 2.35, 0.35) - 4 * WIN(ta, B_QUOTE + 0.2, 0.3)
        + 4 * WIN(ta, B_AGREE + 0.05, 0.35) - 7 * ACT.pulse(ta, 18.5, 0.5);
      const o = { mode, expr, phase: w.ph, blink: ACT.blinkOf(4, ta, 3.3), light: -2.1, seed: 4 };
      if (!moving) o.actPose = { lean };
      if (w.x < 185) inkEll(w.x, 700, 34, 6, 'rgba(20,14,10,.30)', 0);
      actorSide(4, w.x, GY04, S04, o, 1);
    }

    function draw05(ta, forceExpr) {
      const lean = 7 * WIN(ta, B_QUOTE, 0.35) + 5 * WIN(ta, B_ASK2, 0.3) - 5 * WIN(ta, 18.5, 0.4);
      const expr = forceExpr || (ta < B_ASK ? 'neutral'
        : ta < B_QUOTE ? 'dazed'
        : ta < 17.5 ? 'curious'
        : ta < SLAM + 0.2 ? 'effort' : 'smile');
      const o = { mode: 'stand', expr, blink: ACT.blinkOf(5, ta, 2.9), light: -2.1, seed: 5, actPose: { lean } };
      actorSide(5, X05, GY05, S04, o, -1);
    }

    function drawTable() {
      inkEll(512, 712, 382, 22, 'rgba(20,14,10,.32)', 0);
      // top: a shallow 3/4 plane, back edge high enough to hide hanging hands
      inkShape([176, 536, 844, 532, 876, 596, 150, 600], OCHRE1, 4.2);
      inkLine([182, 556, 848, 552], 1.6, 'rgba(42,33,26,.38)');
      inkLine([174, 576, 858, 572], 1.6, 'rgba(42,33,26,.38)');
      for (const [a, b, c, d] of TABLE_GRAIN) inkLine([a, b, c, d], 1.3, 'rgba(107,74,47,.55)', { taper: .45 });
      inkLine([182, 538, 840, 534], 2.2, 'rgba(226,208,168,.30)');
      // apron
      inkShape([150, 600, 876, 596, 888, 716, 138, 720], OCHRE0, 4.2);
      for (const x of [198, 378, 558, 738]) {
        inkOutline([x, 622, x + 118, 620, x + 120, 684, x + 2, 686], 3, 'rgba(42,33,26,.72)');
        inkLine([x + 16, 634, x + 104, 632], 2, 'rgba(163,76,50,.50)');
      }
      for (let i = 0; i < 9; i++) inkLine([160 + i * 82, 604, 154 + i * 82, 714], 1.2, 'rgba(74,50,32,.40)');
      inkLine([138, 718, 888, 714], 2.2, 'rgba(226,208,168,.20)');
    }

    function drawBowl(x, y, sc = 1, dy = 0) {
      const yy = y + dy;
      inkShape([x - 34 * sc, yy, x - 26 * sc, yy + 24 * sc, x + 26 * sc, yy + 24 * sc, x + 34 * sc, yy], CREAM, 2.6);
      inkEll(x, yy, 34 * sc, 8.5 * sc, CREAM2, 0);
      inkEll(x, yy, 27 * sc, 5.5 * sc, RUST, 0);
      inkEll(x - 8 * sc, yy - 1, 7 * sc, 1.6 * sc, 'rgba(240,207,122,.55)', 0);
      inkLine([x - 11 * sc, yy + 25 * sc, x + 11 * sc, yy + 25 * sc], 4 * sc, '#c9b98a');
    }

    function drawJug(x, y, rot) {
      L.push(); L.tr(x, y); L.rot(rot);
      // a round-bellied wine ewer: collar, belly, spout, loop handle
      inkShape([-24, -18, -12, -26, 12, -26, 24, -18, 30, 2, 24, 20, 10, 26, -10, 26, -24, 20, -30, 2], OCHRE2, 3.2);
      inkShape([-15, -32, 15, -32, 19, -23, -19, -23], OCHRE1, 2.8);
      inkShape([-30, -4, -46, -10, -52, 4, -32, 10], OCHRE2, 2.8);
      inkLine([25, -12, 42, -2, 40, 16, 24, 20], 6, OCHRE1, { cap: true });
      inkLine([33, -6, 38, 2, 37, 12, 30, 15], 2, 'rgba(74,50,32,.55)');
      inkLine([-13, -18, -9, 12], 3, 'rgba(240,207,122,.42)', { taper: .6 });
      inkEll(2, 20, 16, 4, 'rgba(74,50,32,.28)', 0);
      inkEll(-1, -25, 12, 3.5, 'rgba(120,52,36,.85)', 0);
      L.pop();
    }

    function drawPourArm(ta) {
      // the wanderer (04, at x≈330) lifts the ewer and pours for his friend
      const k = WIN(ta, 2.36, 0.28) * (1 - WIN(ta, 2.86, 0.12));   // 1 = lifted to pour
      const jx = lerp(470, 452, k), jy = lerp(548, 474, k), jr = lerp(-0.05, -0.62, k);
      const cs = Math.cos(jr), sn = Math.sin(jr);
      const gripL = [22, 20];
      const hx = jx + gripL[0] * cs - gripL[1] * sn, hy = jy + gripL[0] * sn + gripL[1] * cs;
      const wx = hx - 12, wy = hy - 3;
      const ex = lerp(394, 404, k), ey = lerp(512, 492, k);
      const av = clamp((k - 0.12) / 0.18, 0, 1);
      drawJug(jx, jy, jr);
      if (av > 0.02) {
        // the near arm crosses in front of the ewer, so its hand stays visible on the jug's near edge
        inkLine([344, 438, ex, ey], 14, `rgba(63,107,96,${av})`, { cap: true, taper: .1 });
        inkLine([ex, ey, wx, wy], 11, `rgba(63,107,96,${av})`, { cap: true, taper: .12 });
        inkLine([348, 431, ex - 2, ey - 6, wx - 2, wy - 4], 4, `rgba(226,208,168,${0.15 * av})`, { taper: .6 });
        inkLine([wx + 4, wy - 6, wx - 4, wy + 6], 13, `rgba(47,79,71,${av})`, { cap: true });
        inkLine([wx + 4, wy - 6, wx - 4, wy + 6], 1.6, `rgba(20,30,26,${0.5 * av})`);
        // the hand round the ewer's near side: a small cartoon hand, not a mitt
        inkEll(hx, hy, 6.2, 6.8, `rgba(214,171,122,${av})`, 0);
        L.L(L.pEll(hx, hy, 6.2, 6.8, 0, TAU, 24), 1.5, `rgba(36,23,38,${av})`, { closed: true });
        for (let i = 0; i < 3; i++) inkLine([hx - 4 + i * 3.4, hy - 5, hx - 3 + i * 3.4, hy + 4], 1.7, `rgba(214,171,122,${av})`, { cap: true });
        inkLine([hx - 5, hy + 5, hx + 5, hy + 4], 1.2, `rgba(90,60,40,${0.55 * av})`);
      }
      // the wine: from the real spout tip down into the cup
      const a = SMOOTH(2.56, 2.66, ta) * (1 - SMOOTH(2.80, 2.92, ta));
      if (a > 0.02) {
        const tx = jx - 52 * cs - 4 * sn, ty = jy - 52 * sn + 4 * cs;
        const sx2 = tx + Math.sin(ta * 18) * 1.1;
        inkLine([tx, ty + 3, sx2 - 1, (ty + 566) / 2, sx2, 566], 3, `rgba(230,201,141,${0.8 * a})`, { taper: .3 });
        inkEll(sx2, 566, 6, 3.5, `rgba(240,207,122,${0.45 * a})`, 0);
        for (let i = 0; i < 2; i++) inkEll(sx2 + (i - 0.5) * 9, 544 + i * 10, 1.6, 2.2, `rgba(240,207,122,${0.5 * a})`, 0);
      }
    }

    function drawSlamArm(ta) {
      const u = WIN(ta, 17.50, 0.10) * (1 - WIN(ta, SLAM + 0.52, 0.16));
      if (u < 0.02) return;
      // the friend's near arm: fist on the table, a short lift, then down (05 at x≈620, facing left)
      const lift = SMOOTH(17.52, 17.79, ta) * (1 - SMOOTH(17.82, SLAM, ta));
      const sx = 638, sy = 478;
      const ex = lerp(606, 620, lift), ey = lerp(512, 496, lift);
      const hx = lerp(574, 664, lift), hy = lerp(540, 470, lift);
      // the fist's shadow on the table keeps it anchored when it is down
      const down = 1 - lift;
      if (down > 0.05) inkEll(hx + 6, hy + 8, 17, 5.5, `rgba(36,23,38,${0.20 * down})`, 0);
      inkLine([sx, sy, ex, ey], 21, INK, { cap: true, taper: .08 });
      inkLine([sx, sy, ex, ey], 17, '#6d7f75', { cap: true, taper: .08 });
      inkLine([ex, ey, hx, hy], 18, INK, { cap: true, taper: .12 });
      inkLine([ex, ey, hx, hy], 14, '#6d7f75', { cap: true, taper: .12 });
      inkLine([sx - 2, sy - 5, ex - 3, ey - 6, hx - 2, hy - 5], 4, 'rgba(226,208,168,.22)', { taper: .6 });
      // cuff and fist, one size up so the punch reads at this camera
      inkLine([hx + 9, hy - 8, hx - 7, hy + 8], 19, '#2f3a32', { cap: true });
      inkEll(hx, hy, 13.5, 11.5, '#d6ab7a', 2.6);

      for (const [bx, by, s] of [[320, 150, 1.2], [372, 126, 1.0]]) {
        const f = Math.sin(ta * 3.4 + bx) * 3 * s;
        inkLine([bx - 8 * s, by, bx, by - 5 * s + f, bx + 8 * s, by], 2.2 * s, 'rgba(42,33,26,.6)', { taper: .3 });

      motes(ta, 16, 60, 900, 120, 620, '239,227,196', 0.14);
    }

    /* ============================================================
       4 · 阁楼与老照片
       ============================================================ */
    function drawPhoto(x, y, w, h, opt = {}) {
      const alive = opt.alive ?? 0, detail = opt.detail ?? 1;
      const sky0 = mix2('#a06e3e', '#d3aa63', alive * 0.7), sky1 = mix2('#e8d4a0', '#efe3c4', alive);
      const horizon = y + h * 0.72;
      for (let i = 0; i < 14; i++) {
        const yy = y + h * 0.72 * i / 14;
        inkFill([x, yy, x + w, yy, x + w, yy + h * 0.72 / 14 + 1, x, yy + h * 0.72 / 14 + 1], mix2(sky0, sky1, i / 14));
      }
      inkFill([x, horizon, x + w, horizon, x + w, y + h, x, y + h], mix2('#a5844e', '#c49a55', alive));
      // a low sun behind the tomb, and its haze
      inkEll(x + 0.30 * w, y + 0.30 * h, 0.045 * w, 0.045 * w, `rgba(255,240,200,${0.22 + alive * 0.3})`, 0);
      glow(x + 0.30 * w, y + 0.30 * h, 0.02 * w, 0.16 * w, '255,236,190', 0.05 + alive * 0.05, 8);
      // platform and the mausoleum
      inkFill([x + 0.16 * w, y + 0.66 * h, x + 0.84 * w, y + 0.66 * h, x + 0.87 * w, y + 0.78 * h, x + 0.13 * w, y + 0.78 * h], mix2('#c9b98a', '#efe3c4', alive));
      inkLine([x + 0.13 * w, y + 0.78 * h, x + 0.87 * w, y + 0.78 * h], 1.6, '#7a5a3a');
      inkShape([x + 0.34 * w, y + 0.44 * h, x + 0.66 * w, y + 0.44 * h, x + 0.68 * w, y + 0.67 * h, x + 0.32 * w, y + 0.67 * h], mix2('#efe3c4', '#f6efdc', alive), 2.2, '#6b4a2f');
      // the great dome, with a lit side and a shadowed rib
      const cx = x + 0.5 * w, yb = y + 0.44 * h, rx = 0.105 * w, yt = y + 0.255 * h;
      inkShape([cx - rx, yb, cx - rx * 0.82, yb - 0.09 * h, cx - rx * 0.35, yb - 0.15 * h, cx, yt, cx + rx * 0.35, yb - 0.15 * h, cx + rx * 0.82, yb - 0.09 * h, cx + rx, yb], mix2('#e8d4a8', '#f8f0da', alive), 2.6, '#5a4632');
      const domeArc = L.pEll(cx, yb, rx * 0.98, 0.19 * h, Math.PI, TAU, 22);
      inkLine(domeArc, 1.4, 'rgba(122,90,58,.30)');
      inkShape([cx - rx * 0.98, yb, cx - rx * 0.62, yb - 0.135 * h, cx - rx * 0.18, yb - 0.176 * h, cx - rx * 0.28, yb - 0.02 * h], `rgba(255,248,226,${0.20 + alive * 0.16})`, 0);
      inkLine([cx, yt, cx, yt - 0.035 * h], 1.8, '#6b4a2f');
      inkEll(cx, yt - 0.04 * h, 0.012 * w, 0.012 * w, '#6b4a2f', 0);
      inkShape([cx - 0.086 * w, yb, cx + 0.086 * w, yb, cx + 0.08 * w, yb + 0.03 * h, cx - 0.08 * w, yb + 0.03 * h], mix2('#d5c092', '#efe3c4', alive), 1.8, '#5a4632');
      // the iwan and side arches
      inkShape([cx - 0.062 * w, y + 0.665 * h, cx - 0.045 * w, y + 0.54 * h, cx, y + 0.505 * h, cx + 0.045 * w, y + 0.54 * h, cx + 0.062 * w, y + 0.665 * h], '#7a5a3e', 1.8, '#4a3524');
      inkLine([cx - 0.030 * w, y + 0.665 * h, cx - 0.030 * w, y + 0.575 * h], 1.2, 'rgba(239,227,196,.28)');
      for (const s of [-1, 1]) {
        inkShape([cx + s * 0.115 * w, y + 0.665 * h, cx + s * 0.10 * w, y + 0.585 * h, cx + s * 0.075 * w, y + 0.665 * h], '#8a6a48', 1.4, '#5a4632');
      }
      // four minarets with balconies
      for (const s of [-1, 1]) for (const d of [0.20, 0.29]) {
        const mx = cx + s * d * w, top = y + 0.33 * h;
        inkShape([mx - 0.012 * w, y + 0.70 * h, mx - 0.009 * w, top, mx, top - 0.028 * h, mx + 0.009 * w, top, mx + 0.012 * w, y + 0.70 * h], mix2('#e2d0a8', '#f6efdc', alive), 1.4, '#6b4a2f');
        inkShape([mx - 0.017 * w, y + 0.44 * h, mx + 0.017 * w, y + 0.44 * h, mx + 0.014 * w, y + 0.468 * h, mx - 0.014 * w, y + 0.468 * h], '#8a6a48', 1.2, '#5a4632');
        inkLine([mx + s * 0.004 * w, y + 0.70 * h, mx + s * 0.004 * w, y + 0.47 * h], 1, 'rgba(255,248,226,.22)');
      }
      // cypresses
      for (const s of [-1, 1]) {
        const tx = cx + s * 0.255 * w;
        inkShape([tx, y + 0.72 * h, tx - 0.035 * w, y + 0.54 * h, tx, y + 0.44 * h, tx + 0.035 * w, y + 0.54 * h], mix2('#5f682b', '#7f8840', alive), 1.8, '#41491f');
        inkLine([tx, y + 0.70 * h, tx, y + 0.52 * h], 1.2, 'rgba(239,227,196,.16)');
      }
      // reflecting pool: horizontal ripples, not glyphs
      inkShape([cx - 0.20 * w, y + 0.79 * h, cx + 0.20 * w, y + 0.79 * h, cx + 0.27 * w, y + 0.98 * h, cx - 0.27 * w, y + 0.98 * h], mix2('#8a7a5a', '#4c6b72', alive), 2, '#5a4632');
      for (let i = 0; i < 7; i++) {
        const ry = y + (0.82 + i * 0.022) * h, half = 0.185 * w * (1 - i * 0.035);
        inkLine([cx - half, ry, cx + half * 0.82, ry + 0.003 * h], 1.2, `rgba(239,227,196,${0.12 + alive * 0.16 - i * 0.008})`, { taper: .5 });
      }
      // the tiny figure in the held photo only: young Pan, the same blue suit and red tie
      if (detail > 0.5) {
        const fx = cx + 0.02 * w, fy = y + 0.735 * h, fh = 0.12 * h;
        inkEll(fx, fy - 0.80 * fh, 0.15 * fh, 0.19 * fh, '#d8b08a', 0.7);
        inkEll(fx, fy - 0.89 * fh, 0.145 * fh, 0.09 * fh, '#241c16', 0);
        inkShape([fx - 0.19 * fh, fy - 0.66 * fh, fx + 0.19 * fh, fy - 0.66 * fh, fx + 0.17 * fh, fy - 0.08 * fh, fx - 0.17 * fh, fy - 0.08 * fh], '#2f4258', 0.7);
        inkLine([fx, fy - 0.63 * fh, fx, fy - 0.30 * fh], 1.2, '#a34c32');
        inkLine([fx - 0.07 * fh, fy - 0.08 * fh, fx - 0.08 * fh, fy], 1.6, '#26313f');
        inkLine([fx + 0.07 * fh, fy - 0.08 * fh, fx + 0.08 * fh, fy], 1.6, '#26313f');
      }
      if (opt.border !== false) {
        const b = 0.032 * Math.min(w, h);
        inkFill([x, y, x + w, y, x + w, y + b, x, y + b], CREAM);
        inkFill([x, y + h - b, x + w, y + h - b, x + w, y + h, x, y + h], CREAM);
        inkFill([x, y, x + b, y, x + b, y + h, x, y + h], CREAM);
        inkFill([x + w - b, y, x + w, y, x + w, y + h, x + w - b, y + h], CREAM);
      }
    }

    function drawTrunk() {
      // an open camphor chest in the attic
      inkShape([320, 600, 704, 596, 720, 704, 306, 712], '#6b4a2f', 4);
      inkShape([306, 712, 720, 704, 720, 720, 306, 720], '#4a3524', 2.4);

      for (let i = 0; i < 5; i++) inkLine([380 + i * 70, 490, 374 + i * 70, 588], 1.4, 'rgba(107,74,47,.45)');

    function draw06(ta, photoUp, liftAt = 16.0) {
      const lean = 9 + 4 * WIN(ta, liftAt, 0.4);
      const o = { mode: 'stand', expr: photoUp ? 'smile' : 'curious', blink: ACT.blinkOf(6, ta, 3.1), light: -2.1, seed: 6, actPose: { lean } };

    function draw06Reach(hx, hy) {

      inkLine([700, 486, 640, 498, hx - 2, hy - 7], 5, 'rgba(226,208,168,.22)', { taper: .7 });

    function atticScene(ta, liftAt = 16.0, opt = {}) {
      gradY(0, 720, '#241a14', '#4a3524', 22);
      // gable and rafters
      inkLine([-30, 70, 480, 300, 990, 80], 34, '#3a2a1e');
      inkLine([-20, 120, 470, 320], 26, '#33241a');
      inkLine([980, 126, 490, 320], 26, '#33241a');
      for (let i = 0; i < 7; i++) inkLine([40 + i * 140, 40, 300 + i * 40, 360], 5, 'rgba(74,53,36,.75)', { taper: .3 });
      inkLine([0, 360, 960, 352], 9, '#4a3524');
      // the small window in the roof
      inkShape([120, 224, 286, 216, 292, 356, 126, 364], '#6b4a2f', 3);
      inkShape([134, 236, 274, 230, 280, 344, 140, 350], '#d5c092', 2);
      gradY(236, 350, '#efe3c4', '#b98a49', 12);
      inkEll(216, 268, 30, 30, 'rgba(255,245,210,.35)', 0);
      inkLine([206, 230, 202, 350], 4, '#6b4a2f');
      inkLine([134, 292, 280, 288], 4, '#6b4a2f');
      // the light falling into the attic: a soft outer shaft and a brighter core
      inkFill([280, 300, 620, 520, 540, 560, 200, 360], 'rgba(239,227,196,.035)');
      inkFill([310, 314, 596, 512, 556, 540, 268, 346], 'rgba(247,230,174,.05)');
      inkFill([342, 330, 566, 500, 540, 518, 316, 352], 'rgba(250,238,190,.05)');
      // crates, a rolled rug, cobwebs
      inkShape([760, 430, 940, 424, 948, 620, 754, 628], '#5a4632', 3);
      inkLine([760, 480, 944, 474], 2.4, 'rgba(42,33,26,.5)');
      inkShape([800, 560, 930, 556, 934, 636, 798, 640], '#4a3524', 3);
      inkShape([706, 598, 760, 594, 764, 640, 704, 644], '#8f6633', 2.6);
      for (let i = 0; i < 4; i++) inkLine([10 + i * 18, 10, 70 + i * 20, 60 + i * 12], 1, 'rgba(239,227,196,.16)');
      drawTrunk();
      const photoUp = liftAt != null && ta > liftAt;
      if (opt.actor !== false) draw06(ta, photoUp, liftAt == null ? 16.0 : liftAt);
      // the photograph being held up, in the shaft of light
      if (photoUp) {
        const lift = WIN(ta, liftAt, 0.55);
        const cx = lerp(504, 462, lift), cy = lerp(548, 466, lift);
        const w = lerp(172, 226, lift), h = w * 0.75;
        L.push(); L.tr(cx, cy); L.rot(-0.06 + 0.02 * lift);
        drawPhoto(-w / 2, -h / 2, w, h, { detail: 1 });
        L.pop();
        // the holding arm and hand, over the photo's near edge
        if (opt.hand !== false) draw06Reach(cx + w * 0.40, cy + h * 0.30);
      }
      // dust in the shaft
      motes(ta, 18, 240, 720, 260, 560, '245,222,168', 0.16);
    }

    /* ============================================================
       5 · 澳大利亚内陆 · 篝火与传说
       ============================================================ */
    function drawStars(t, yMax = 420, n = 84) {
      for (let i = 0; i < n; i++) {
        const x = (i * 173 + (i % 7) * 61 + 37) % 960;
        const y = ((i * 97 + (i % 5) * 53 + 23) % yMax);
        const a = (0.10 + 0.30 * (0.5 + 0.5 * Math.sin(t * 1.6 + i * 1.7))) * (1 - 0.45 * y / yMax);
        const r = 0.7 + (i % 4) * 0.32;
        inkFill(L.pEll(x, y, r, r, 0, TAU, 6), `rgba(239,227,196,${a.toFixed(3)})`);
      }
    }

    function drawGalaxy(t) {
      for (let i = 0; i < 120; i++) {
        const u = i / 120;
        const x = 20 + u * 920 + Math.sin(i * 2.1) * 20;
        const y = 82 + u * 246 + Math.sin(u * 5.2) * 30 + Math.cos(i * 1.3) * 14;
        const a = 0.022 + 0.045 * ((i % 5) / 5) + 0.008 * Math.sin(t * 0.8 + i);
        const r = 0.7 + (i % 3) * 0.35;
        inkFill(L.pEll(x, y, r, r, 0, TAU, 5), `rgba(239,227,196,${a.toFixed(3)})`);
      }
    }

    function drawMoon(x, y, r) {
      glow(x, y, r * 0.5, r * 4.4, '248,230,180', 0.12, 12);
      inkEll(x, y, r, r, CREAM, 0);
      inkEll(x - r * 0.32, y - r * 0.18, r * 0.16, r * 0.13, 'rgba(155,143,110,.30)', 0);
      inkEll(x + r * 0.25, y + r * 0.27, r * 0.11, r * 0.09, 'rgba(155,143,110,.25)', 0);
      inkEll(x - r * 0.05, y + r * 0.42, r * 0.09, r * 0.07, 'rgba(155,143,110,.22)', 0);
    }

    function drawCloud(t, x, y, w, h, col, a) {
      for (let i = 0; i < 7; i++) {
        const u = i / 6;
        const px = x + w * u + Math.sin(t * 0.32 + i * 1.7) * 6;
        const py = y + Math.sin(u * Math.PI) * h * 0.34;
        const rx = w * (0.10 + 0.026 * Math.sin(i * 2.3));
        inkEll(px, py, rx, h * 0.55, rgba(col, a), 0);
      }
      inkFill([x, y + h * 0.30, x + w, y + h * 0.22, x + w, y + h * 0.62, x, y + h * 0.70], rgba(col, a * 0.92));
      inkLine([x + 10, y + h * 0.30, x + w - 10, y + h * 0.22], 1.2, `rgba(239,227,196,${(a * 0.55).toFixed(3)})`, { taper: .5 });
    }

    function drawGum(x, gy, s, lean = 0) {

      inkShape([-12, 0, -16, -66, -6, -138, -14, -208, -2, -276, 8, -206, 4, -136, 16, -66, 12, 0], '#d5c092', 2.6, '#5a4a38');

      inkLine([2, -178, 50, -238, 72, -276], 4.6, '#b9a883', { taper: .5 });

        inkEll(bx, by, rx, ry, c, 2, 'rgba(42,33,26,.55)');

    function drawHandStencil(x, y, s) {

      const fingers = [[-15, -6, -23, -33], [-6, -12, -9, -43], [3, -13, 4, -45], [11, -10, 18, -38], [17, -1, 27, -20]];
      for (const [a, b, c, d] of fingers) inkLine([x + a * s, y + b * s, x + c * s, y + d * s], 7 * s, 'rgba(239,227,196,.80)', { cap: true });

    function drawHandRock(x, y, s) {

    function drawFire(t, x, y, s) {
      const fl = 0.9 + 0.10 * Math.sin(t * 8.7) + 0.05 * Math.sin(t * 15.3 + 1);
      glow(x, y - 26 * s, 18 * s, 150 * s, '248,170,92', 0.14 * fl, 14);

      inkLine([x - 44 * s, y + 6 * s, x + 40 * s, y + 2 * s], 10 * s, '#3a2418', { cap: true });

    function drawEmbers(t, x, y, s, n = 16) {
      for (let i = 0; i < n; i++) {
        const u = ((t * 0.34 + i * 0.137) % 1);
        const px = x + (i - n / 2) * 5 * s + Math.sin(t * 1.6 + i * 1.7) * 10 * s * u;
        const py = y - 16 * s - u * 138 * s;

        inkEll(px, py, 1.1 * s, 1.8 * s, `rgba(240,207,122,${a.toFixed(3)})`, 0);

    function drawSmoke(t, x, y, s) {
      for (let i = 0; i < 3; i++) {
        const pts = [];
        for (let k = 0; k <= 6; k++) {
          const v = k / 6;
          pts.push(x + Math.sin(t * 0.9 + i * 1.8 + v * 4.2) * (6 + v * 20) * s, y - (24 + v * 150) * s - i * 10 * s);
        }
        inkLine(pts, (3 + i) * s, `rgba(200,190,160,${(0.10 - i * 0.02).toFixed(3)})`, { taper: .7 });
      }
    }

    // the elder's bent legs: hip under the robe, knee up and forward, shin down to a bare foot on the ground
    function drawElderLegs(t) {
      const br = Math.sin(t * 1.1) * 1.2;
      const leg = (dx, w, col) => {
        const pts = [668 + dx, 672, 648 + dx, 642 + br, 630 + dx, 664, 624 + dx, 694];
        inkLine(pts, w + 4.4, INK, { taper: .14, cap: true });
        inkLine(pts, w, col, { taper: .14, cap: true });

      };
      leg(-14, 12, '#6b4a2f');                       // far leg, darker
      leg(0, 14.5, '#7d5a3a');                       // near leg, lit by the fire

      const foot = (fx, fy, col) => {
        inkEll(fx - 14, fy + 8, 19, 6.6, col, 2.2);
        inkLine([fx - 30, fy + 8, fx + 2, fy + 7], 1.2, 'rgba(36,23,38,.35)');
        for (let i = 0; i < 3; i++) inkLine([fx - 26 + i * 6, fy + 5, fx - 25 + i * 6, fy + 11], 1.1, 'rgba(36,23,38,.35)');
      };
      foot(618, 696, '#6b4326');
      foot(610, 690, '#5a3620');
    }

    function drawBikeLocal(t, s, spin, dir = 1) {
      L.push(); L.scl(dir, 1);
      const R = 125 * s, WB = 460 * s, cy = -R;
      const rear = -0.48 * WB, front = 0.52 * WB;
      for (const wx of [rear, front]) {
        inkEll(wx, cy, R, R, null, 3.2, '#241c16');
        for (let i = 0; i < 9; i++) {
          const a = spin + i * TAU / 9;
          inkLine([wx + Math.cos(a) * R * 0.14, cy + Math.sin(a) * R * 0.14, wx + Math.cos(a) * R * 0.92, cy + Math.sin(a) * R * 0.92], 1.3, '#5a5650');
        }
        inkEll(wx, cy, 5 * s, 5 * s, RUST, 0);
      }
      const crank = [0, -1.05 * R], seat = [-0.18 * WB, -1.95 * R], bar = [0.30 * WB, -2.05 * R];
      inkLine([rear, cy, crank[0], crank[1], front, cy], 4.2, '#3a3a34', { cap: true });
      inkLine([crank[0], crank[1], seat[0], seat[1], rear, cy], 3.8, '#3a3a34', { cap: true });
      inkLine([seat[0], seat[1], bar[0], bar[1], front, cy], 3.8, '#3a3a34', { cap: true });
      inkShape([seat[0] - 16 * s, seat[1] - 5 * s, seat[0] + 16 * s, seat[1] - 7 * s, seat[0] + 18 * s, seat[1] + 4 * s, seat[0] - 18 * s, seat[1] + 3 * s], '#2a211a', 2.2);
      inkLine([bar[0] - 14 * s, bar[1] - 7 * s, bar[0], bar[1], bar[0] + 8 * s, bar[1] - 10 * s], 5 * s, '#2a211a', { cap: true });
      inkEll(crank[0], crank[1], 9 * s, 9 * s, null, 2.4, '#2a211a');
      inkLine([crank[0] - 12 * s, crank[1] + 5 * s, crank[0] + 12 * s, crank[1] - 5 * s], 4 * s, '#2a211a', { cap: true });
      inkLine([rear, cy + 4 * s, crank[0], crank[1] + 3 * s], 1.4, 'rgba(42,33,26,.7)');
      L.pop();
    }

    // 新加坡国家图书馆：高窗、书架、吊扇、长桌上的合订本
    function bookRow(x0, x1, y, h, seed) {
      let x = x0;
      let i = 0;
      while (x < x1 - 6) {
        const w = 7 + ((i * 13 + seed) % 9);
        const hh = h * (0.78 + 0.22 * (((i * 7 + seed) % 10) / 10));
        const cols = ['#3f6b60', '#8f6633', '#a34c32', '#5f682b', '#2c5450', '#b98a49'];
        inkFill([x, y - hh, x + w, y - hh, x + w, y, x, y], cols[(i + seed) % cols.length]);
        inkLine([x, y - hh + 6, x + w, y - hh + 6], 0.8, 'rgba(36,23,38,.35)');
        x += w + 2;
        i++;
      }
      inkFill([x0 - 6, y, x1 + 6, y, x1 + 6, y + 7, x0 - 6, y + 7], '#4a3524');
    }

      inkEll(-96, 96, 20, 20, null, 2.6, 'rgba(163,76,50,.6)');
      // 右页正在落笔的字：竖排四列，行书连笔随 u 长出来
      const n = Math.floor(clamp(u, 0, 1) * 17);
      let k = 0;
      for (let col = 0; col < 4; col++) {
        const gx = 108 + col * 46;
        for (let row = 0; row < 5; row++) {
          if (k >= n) break;
          const gy = -96 + row * 46;
          const h1 = Math.abs(Math.sin(k * 12.9898 + col) * 43758.5453) % 1;
          const h2 = Math.abs(Math.sin(k * 7.233 + col * 3.1) * 12543.21) % 1;
          const h3 = Math.abs(Math.sin(k * 3.717 + col * 5.7) * 9271.33) % 1;
          const jx = (h1 - 0.5) * 5, jy = (h2 - 0.5) * 5;
          inkLine([gx + jx, gy - 17 + jy, gx - 3 + jx, gy - 2, gx + 2 + jx, gy + 12, gx + 6 + jx, gy + 18], 3.8, 'rgba(42,33,26,.84)', { taper: .4 });

    // 沙漠：白天 / 黄昏 / 夜
    function desertScene(t, opt = {}) {
      const night = opt.night || 0, dawn = opt.dawn || 0;
      if (night) gradY(0, 560, '#241c16', '#3a2a1e', 16);
      else if (dawn) gradY(0, 560, '#6b4a5a', '#e8c98a', 18);

        inkEll(760, 132, 34, 34, 'rgba(239,227,196,.7)', 0);

      const lanes = night
        ? [[330, '#3a2a1e'], [420, '#4a3524'], [510, '#5a4632'], [610, '#6b4a2f']]
        : dawn ? [[330, '#b98a49'], [420, '#a87a3f'], [510, '#8f6633'], [610, '#7d5a2e']]
        : [[330, '#d3aa63'], [420, '#c99a52'], [510, '#b98a49'], [610, '#a87a3f']];

        const pts = [0, yy + 40];

    function drawDrum(x, y, r, t, hit = 0) {

          x + Math.cos(a2) * r * 0.84, y + Math.sin(a2) * r * 0.88], 2.6, 'rgba(58,36,24,.55)');

      for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; inkEll(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.97, 3, 3, '#3a2418', 0); }

      drawGum(700, 542, 0.4, 0.04);
      const q = t - E_DART, hitQ = 0.95;
      if (q < hitQ) {
        drawRider(t, 372, 640, 0.34, { spin: t * 8.8, phase: (t * 1.1) % 1 });
      } else {
        const f = SMOOTH(0.9, 1.35, q);
        L.push();
        L.tr(372, 648); L.rot(-1.5 * f); L.tr(-372, -648);
        drawRider(t, 372, 642, 0.34, { spin: t * 7.0, phase: (t * 1.1) % 1 });

        // 车身擦地的拖痕和扬尘
        inkLine([372, 650, 300 - f * 52, 656], 6, 'rgba(74,50,32,.30)', { taper: .3 });
        for (let i = 0; i < 8; i++) {
          const d = Math.max(0, f - 0.05);
          inkEll(322 - d * 82 - i * 20, 626 + (i % 3) * 12, 24 + i * 11, 14 + i * 5, `rgba(226,208,168,${(0.34 * (1 - d) * (1 - i * 0.10)).toFixed(3)})`, 0);
        }
      }
      // 飞镖的路线
      const bq = clamp(q / hitQ, 0, 1);
      let bx, by;
      if (q <= hitQ) {
        bx = lerp(1040, 452, bq);
        by = lerp(210, 566, bq) - 190 * Math.sin(Math.PI * bq);
      } else {
        const r = q - hitQ;
        bx = 452 + r * 260;
        by = 566 - r * 330;
      }
      const rot = q * 16;
      if (q > 0.05) {
        drawBoomerang(bx - 32, by + 8, rot - 0.5, 0.85);
        drawBoomerang(bx - 16, by + 4, rot - 0.25, 0.92);
        drawBoomerang(bx, by, rot, 1.0);
      }
      if (q > 0.12 && q < hitQ) {
        for (let i = 0; i < 4; i++) {
          const u6 = i / 4;
          inkLine([bx - 80 - u6 * 70, by + 6 - u6 * 6, bx - 34 - u6 * 60, by + 2 - u6 * 4], 1.6, `rgba(239,227,196,${(0.22 * (1 - u6)).toFixed(3)})`, { taper: .6 });
        }
      }
      // 击中时的星芒
      if (q >= hitQ - 0.06 && q < hitQ + 0.5) {
        const k = clamp((q - hitQ + 0.06) / 0.5, 0, 1);
        for (let i = 0; i < 7; i++) {

      }
      motes(t, 10, 70, 900, 180, 620, '245,222,168', 0.09);
    }

      const pts = [[600, 604], [592, 540], [582, 476], [566, 420], [520, 372], [460, 340], [420, 306], [470, 268], [560, 242], [650, 224], [702, 196]];
      const q = clamp((t - E_ROUTE) / 2.2, 0, 1);
      let total = 0;
      const segs = [];
      for (let i = 1; i < pts.length; i++) {
        const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        segs.push(d); total += d;
      }
      let left = total * q;
      for (let i = 1; i < pts.length && left > 0; i++) {
        const d = segs[i - 1], k = Math.min(1, left / d);
        const x0 = pts[i - 1][0], y0 = pts[i - 1][1];
        const x1 = x0 + (pts[i][0] - x0) * k, y1 = y0 + (pts[i][1] - y0) * k;
        inkLine([x0, y0, x1, y1], 5.2, 'rgba(178,58,43,.85)', { taper: .2, cap: true });
        left -= d;
      }
      for (let i = 0; i < pts.length; i++) inkEll(pts[i][0], pts[i][1], 4.4, 4.4, i === 0 ? '#b23a2b' : 'rgba(42,33,26,.7)', 0);

        inkEll(p[0], p[1], 15, 15, null, 1.4, 'rgba(178,58,43,.4)');

    }

      const shoeY = hold ? 508 : lerp(140, 508, q * q);
      const shoeX = 512;

      inkLine([shoeX - 48, shoeY + 36, shoeX + 56, shoeY + 32], 2, 'rgba(36,28,22,.5)');

      for (let i = 0; i < 4; i++) inkLine([shoeX - 34 + i * 18, shoeY - 18, shoeX - 28 + i * 18, shoeY - 4], 1.8, 'rgba(239,227,196,.18)');

        inkEll(lx + sw, -4, 6, 4, '#3a2a1e', 0);

      inkEll(0, -52, 54, 28, '#6b4a2f', 3, '#2a1c14');
      inkLine([-50, -64, -74, -82, -70 + Math.sin(ph * 1.6) * 10, -104], 9, '#4a3524', { taper: .2, cap: true });

    function endingScene(t) {
      gradY(0, 720, '#e8b87a', '#a34c32', 22);
      // 巷口的天空和屋脊
      inkFill([0, 0, 240, 0, 220, 720, 0, 720], '#4a3a2c');
      inkFill([720, 0, 960, 0, 960, 720, 760, 720], '#4a3a2c');
      for (let i = 0; i < 4; i++) {
        inkShape([0, 120 + i * 120, 220, 100 + i * 120, 224, 140 + i * 120, 0, 160 + i * 120], '#3a2a1e', 2, '#241a14');
        inkShape([760, 100 + i * 120, 960, 120 + i * 120, 960, 160 + i * 120, 756, 140 + i * 120], '#3a2a1e', 2, '#241a14');
      }
      // 远处巷子里的灯
      for (let i = 0; i < 3; i++) {
        inkEll(300 + i * 90, 260 + (i % 2) * 40, 6, 8, 'rgba(248,214,146,.8)', 0);
        glow(300 + i * 90, 268 + (i % 2) * 40, 10, 90, '248,200,130', .10, 8);
      }
      // 地面
      inkFill([0, 560, 960, 548, 960, 720, 0, 720], '#8a6a44');
      for (let i = 0; i < 6; i++) inkLine([0, 596 + i * 24, 960, 590 + i * 24], 1.2, 'rgba(42,28,20,.18)');
      // 04 牵着狗走进巷口（人物和狗都留在字幕带以上）
      const walk = clamp((t - 535.36) / 1.1, 0, 1);
      const px = lerp(430, 610, walk);
      const stop = clamp((t - 536.55) / 0.4, 0, 1);
      const wave = Math.sin(t * 5.4) * 8 * stop;
      // 远侧摆臂：先画在大衣后面，走路时前后摆，停下收住
      const swing = Math.sin(t * 2.4) * 9 * (1 - stop);
      inkLine([px - 26, 404, px - 62, 448, px - 86, 484 + swing * 0.5], 27, '#1c2a26', { taper: .16, cap: true });
      inkLine([px - 26, 404, px - 62, 448, px - 86, 484 + swing * 0.5], 20, '#4a7e71', { taper: .16, cap: true });
      inkEll(px - 90, 490 + swing * 0.5, 12, 11, '#cfa06c', 2.6, '#241a14');
      actorSide(4, px, 620, 0.58, {
        mode: stop > 0.5 ? 'stand' : 'stroll', phase: (t * 1.3) % 1, expr: 'smile',
        blink: ACT.blinkOf(4, t, 3.6), light: -0.8, seed: 4,
        actPose: { lean: 4 - 3 * stop, head: 3 - 6 * stop, armN: [-38 - 16 * stop, -50 - 24 * stop + wave * 0.4], armF: [-32, -44], farFront: true },
      }, 1);
      drawDog(px + 96, 624, 0.62, t, 1);
      // 牵绳的手在胸前（远侧那只手）：绳先画（从掌心后面穿出来），手压上去
      const lx = px + 53, ly = 411;
      inkLine([lx + 10, ly + 12, px + 96, 496, px + 116, 560, px + 120, 584], 2.8, 'rgba(58,42,28,.82)', { taper: .2 });
      inkEll(lx, ly, 17, 14, '#cfa06c', 2.8, '#241a14');
      for (let f = 0; f < 4; f++) {
        const fy = ly - 9 + f * 6.4;
        inkLine([lx + 14, fy, lx - 2, fy - 1], 5.4, '#e0b47e', { cap: true });
        inkLine([lx + 14, fy + 3.2, lx - 2, fy + 2.2], 1.5, 'rgba(36,20,14,.85)', { cap: true });
      }
      inkLine([lx - 4, ly + 12, lx + 9, ly + 1], 7.4, '#c99563', { taper: .3, cap: true });
      // 挥手的近侧手臂：肩 → 肘 → 腕，再自己画一只张开的手（演员自带的手只有十几像素，读不出挥手）
      if (stop > 0.05) {
        const wv = Math.sin(t * 5.2) * 6 * stop;
        inkLine([px + 8, 352, px + 42, 320, px + 108, 228], 32, '#1c2a26', { taper: .26, cap: true });
        inkLine([px + 8, 352, px + 42, 320, px + 108, 228], 24, '#4a7e71', { taper: .26, cap: true });
        const hcx = px + 120, hcy = 214 + wv;
        // 掌心 + 四指朝上分开（指缝 ≈ 10 屏幕 px）+ 拇指；手背压得比晚霞暗一档，逆光才读得出
        for (let f = 0; f < 4; f++) {
          const fx = hcx - 21 + f * 14, len = 38 - Math.abs(f - 1.2) * 5;
          inkLine([fx, hcy - 12, fx + (f - 1.5) * 3.6, hcy - 12 - len], 11.4, '#2a1a12', { cap: true });
        }
        inkEll(hcx, hcy, 26, 20, '#cf9360', 3.8, '#2a1a12');
        for (let f = 0; f < 4; f++) {
          const fx = hcx - 21 + f * 14, len = 38 - Math.abs(f - 1.2) * 5;
          inkLine([fx, hcy - 12, fx + (f - 1.5) * 3.6, hcy - 12 - len], 7.4, '#cf9360', { taper: .12, cap: true });
        }
        inkLine([hcx - 23, hcy + 5, hcx - 37, hcy - 11], 12, '#2a1a12', { cap: true });
        inkLine([hcx - 23, hcy + 5, hcx - 37, hcy - 11], 8, '#c07f4c', { taper: .2, cap: true });
        inkLine([hcx - 25, hcy - 8, hcx - 20, hcy + 16], 3.2, 'rgba(255,214,150,.40)', { taper: .3, cap: true });
        inkLine([hcx + 27, hcy - 18, hcx + 40, hcy - 32], 2, `rgba(255,236,196,${(0.38 * stop).toFixed(2)})`, { taper: .4 });
      }
      // 逆光的尘
      motes(t, 12, 60, 900, 140, 620, '255,230,180', 0.10);
      // 暗角
      inkFill([0, 0, 960, 0, 960, 80, 0, 80], 'rgba(20,12,8,.22)');
      inkFill([0, 640, 960, 640, 960, 720, 0, 720], 'rgba(20,12,8,.16)');
    }

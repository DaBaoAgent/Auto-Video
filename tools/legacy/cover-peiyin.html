<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:576px; overflow:hidden; }
  body {
    background:
      radial-gradient(120% 90% at 18% 12%, #2a2118 0%, rgba(23,20,15,0) 62%),
      radial-gradient(90% 80% at 92% 88%, #23180f 0%, rgba(11,10,9,0) 58%),
      #0b0a09;
    color:#ece4d6;
    font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;
    position:relative;
  }
  .grain { position:absolute; inset:0; opacity:.16;
    background-image:repeating-linear-gradient(90deg, rgba(236,228,214,.06) 0 1px, transparent 1px 3px),
                     repeating-linear-gradient(0deg, rgba(236,228,214,.05) 0 1px, transparent 1px 4px);
  }
  .vig { position:absolute; inset:0; box-shadow:inset 0 0 140px 40px rgba(0,0,0,.72); }

  .frame { position:absolute; inset:34px 38px; border:1px solid rgba(236,228,214,.13); }
  .corner { position:absolute; width:16px; height:16px; border:1px solid rgba(233,180,124,.55); }
  .c1 { left:-1px; top:-1px; border-right:0; border-bottom:0; }
  .c2 { right:-1px; top:-1px; border-left:0; border-bottom:0; }
  .c3 { left:-1px; bottom:-1px; border-right:0; border-top:0; }
  .c4 { right:-1px; bottom:-1px; border-left:0; border-top:0; }

  .wave { position:absolute; left:56px; top:150px; width:330px; height:280px; }
  .wave span { position:absolute; bottom:0; width:9px; border-radius:2px;
    background:linear-gradient(180deg,#e9b47c 0%, rgba(233,180,124,.28) 100%); }

  .mic { position:absolute; left:196px; top:112px; width:52px; height:52px; opacity:.9; }

  .copy { position:absolute; left:448px; top:120px; width:520px; }
  .no { font-family:"Consolas",monospace; font-size:13px; letter-spacing:.26em; color:#e9b47c; }
  .no i { display:inline-block; width:34px; height:1px; background:#e9b47c; vertical-align:middle; margin-right:12px; opacity:.7; }
  h1 { font-size:66px; line-height:1.06; letter-spacing:.04em; margin-top:18px; font-weight:700; }
  .en { margin-top:10px; font-family:"Consolas",monospace; font-size:16px; letter-spacing:.30em; text-transform:uppercase; color:rgba(236,228,214,.62); }
  .rule { width:120px; height:1px; background:rgba(233,180,124,.55); margin:22px 0 18px; }
  .desc { font-size:17px; line-height:1.85; color:rgba(236,228,214,.78); }
  .steps { margin-top:22px; font-family:"Consolas",monospace; font-size:13px; letter-spacing:.10em; color:rgba(236,228,214,.52); }
  .steps b { color:#e9b47c; font-weight:400; }

  .timeline { position:absolute; left:56px; bottom:66px; right:56px; height:34px;
    border-top:1px solid rgba(236,228,214,.18); display:flex; align-items:flex-end; gap:4px; }
  .timeline i { flex:1; background:rgba(236,228,214,.14); height:10px; }
  .timeline i.hot { background:linear-gradient(180deg,#e9b47c,rgba(233,180,124,.35)); height:26px; }

  .foot { position:absolute; left:56px; bottom:38px; font-family:"Consolas",monospace; font-size:11px;
    letter-spacing:.22em; color:rgba(236,228,214,.42); }
  .foot2 { position:absolute; right:56px; bottom:38px; font-family:"Consolas",monospace; font-size:11px;
    letter-spacing:.22em; color:rgba(236,228,214,.42); }
</style></head>
<body>
  <div class="grain"></div>
  <div class="vig"></div>

  <div class="frame"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span></div>

  <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="#e9b47c" stroke-width="1.4" stroke-linecap="round">
    <rect x="9" y="2.5" width="6" height="11" rx="3"/>
    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
    <path d="M12 18v3.5"/><path d="M8.6 21.5h6.8"/>
  </svg>

  <div class="wave" id="wave"></div>

  <div class="copy">
    <p class="no"><i></i>11 / 前端工位</p>
    <h1>配音前端</h1>
    <p class="en">Voice Front-end</p>
    <div class="rule"></div>
    <p class="desc">口播稿审计 → 长稿分段合成 → 字幕时间轴。<br>成片之前的两道关口，全在这里跑完。</p>
    <p class="steps">GPT-SoVITS <b>·</b> 分段 <b>/</b> 多音色 <b>/</b> 逐句对齐</p>
  </div>

  <div class="timeline" id="tl"></div>
  <div class="foot">AUTO-VIDEO / ANIMATION WORKSHOP</div>
  <div class="foot2">不出片 · 只出声音</div>

<script>
  // 固定伪随机，保证每次渲染同一张图
  let s = 20261119;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const wave = document.getElementById('wave');
  const n = 34;
  for (let i = 0; i < n; i++) {
    const h = 30 + Math.pow(rnd(), .7) * 240;
    const b = document.createElement('span');
    b.style.left = (i * 9.6) + 'px';
    b.style.height = h.toFixed(0) + 'px';
    b.style.opacity = (0.35 + rnd() * 0.65).toFixed(2);
    wave.appendChild(b);
  }
  const tl = document.getElementById('tl');
  for (let i = 0; i < 46; i++) {
    const b = document.createElement('i');
    if (rnd() > .78) b.className = 'hot';
    tl.appendChild(b);
  }
</script>
</body></html>

    wob += (vn(yTop*.45 + fr*7.3) - .5) * (.35 + 2.5*uTrack);
    float bandC = 1. - fract(fr*.023 + .18);
    float band = smoothstep(.075, 0., abs(vuv.y - bandC)) * uTrack;
    wob += band * (h21(vec2(ln*.5, fr)) - .5) * 70.;
    float gh = 6. + 14.*h11(uGSeed*1.7+.3);
    float gRow = floor((yTop + h11(uGSeed)*80.) / gh);
    float gOn = uGlitch * step(.82, h21(vec2(gRow, uGSeed)));
    wob += gOn * (h21(vec2(gRow, uGSeed+5.)) < .5 ? -1. : 1.) * (8. + 32.*h21(vec2(gRow, uGSeed+3.)));
    float hs = 1. - smoothstep(5., 17., px.y);
    wob += hs * (16. + 24.*h21(vec2(ln, fr)));
    vec2 uv = vuv + (vec2(wob, 0.) + uShake) / CSS;
    vec2 o1 = vec2(1., 0.) / CSS;
    vec3 c0 = texture2D(tDiffuse, uv).rgb;
    float Y = toYIQ(c0).x * .6 + .2 * (toYIQ(texture2D(tDiffuse, uv + o1).rgb).x + toYIQ(texture2D(tDiffuse, uv - o1).rgb).x);
    vec2 iq = vec2(0.); float ws = 0., lag = 1. + gOn * 3.;

    col = mix(col, vec3(sn*.9), uStatic);

    col += sline * smoothstep(.55, .95, vn(px.x/70. + ln*1.7 + fr*3.)) * (.12 + .55*uTrack) * vec3(.9,.95,1.);

    col *= uDim; col += uFlash * vec3(1., .92, .97);
    col *= mod(yTop, 3.) < 1. ? .88 : 1.;

    vec2 p = abs(px - vec2(960., 540.)) - vec2(mw*.5 - rad, mh*.5 - rad);
    float sd = length(max(p, 0.)) + min(max(p.x, p.y), 0.) - rad;
    col *= 1. - smoothstep(-.8, .8, sd);
    col *= inside * (1. + (1. - uCrtY) * 1.4) * step(.02, uCrtX);
    float lx = max(abs(P0.x - 960.) - 960.*uCrtX, 0.), ly = max(abs(P0.y - 540.) - 540.*uCrtY, 0.);
    col += vec3(1., .92, .98) * uCrtG * exp(-ly*ly / 1.1) * exp(-lx*lx / 5.);

// ---------------------------------------------------------------- drawing helpers
const FONT_CN = "'PuHuiTi'";
const FONT_MONO = "'Consolas','Courier New',monospace";
const FONT_IMPACT = "'Impact','Arial Black',sans-serif";
const FONT_SCRIPT = "'Segoe Script','Brush Script MT',cursive";

function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function star4(g, x, y, r, a, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(0.25, `rgba(255,230,250,${a * 0.8})`); gr.addColorStop(1, 'rgba(255,46,136,0)');
  g.fillStyle = gr; g.fillRect(-r, -r, r, r);
  g.strokeStyle = `rgba(255,255,255,${a * 0.95})`; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.moveTo(0, -r * 0.55); g.lineTo(0, r * 0.55); g.stroke();
  g.restore();
}
function flare(g, x, y, I, len = 260) {
  if (I <= 0.001) return;
  const lg = g.createLinearGradient(x - len, y, x + len, y);
  lg.addColorStop(0, 'rgba(255,46,136,0)'); lg.addColorStop(0.35, `rgba(255,80,180,${0.28 * I})`);
  lg.addColorStop(0.5, `rgba(255,245,255,${0.85 * I})`); lg.addColorStop(0.65, `rgba(80,230,255,${0.28 * I})`); lg.addColorStop(1, 'rgba(33,230,255,0)');
  g.save(); g.globalCompositeOperation = 'screen';
  g.fillStyle = lg; g.fillRect(x - len, y - 2, len * 2, 4);
  star4(g, x, y, 70 * I + 18, I);
  g.restore();
}
function chromeText(g, text, cx, cy, size, o = {}) {
  const alpha = o.alpha ?? 1, scale = o.scale ?? 1, glint = o.glint ?? -1, glow = o.glow ?? 0;
  if (alpha <= 0.002) return;
  g.save(); g.translate(cx, cy); g.scale(scale, scale); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `900 ${size}px ${FONT_CN}`;
  g.letterSpacing = `${o.ls ?? 0}px`;
  const w = g.measureText(text).width;
  // ghost chroma
  g.globalAlpha = alpha * 0.55;
  g.fillStyle = '#FF2E88'; g.fillText(text, -size * 0.035, 0);
  g.fillStyle = '#21E6FF'; g.fillText(text, size * 0.035, 0);
  // extrusion
  g.globalAlpha = alpha;
  g.fillStyle = '#16032c';
  for (let i = 3; i >= 1; i--) g.fillText(text, 0, i * size * 0.035);
  // main gradient: broad mid-tones + two narrow highlights = chrome, without a white slab
  const gr = g.createLinearGradient(0, -size * 0.62, 0, size * 0.62);
  gr.addColorStop(0.00, '#a9c9e2'); gr.addColorStop(0.15, '#5f82a8'); gr.addColorStop(0.30, '#c9e2f5');
  gr.addColorStop(0.43, '#3d5a7e'); gr.addColorStop(0.50, '#e6f4ff'); gr.addColorStop(0.57, '#3d5a7e');
  gr.addColorStop(0.68, '#6a4cae'); gr.addColorStop(0.82, '#a3c4dc'); gr.addColorStop(1.00, '#4a6a8c');
  g.fillStyle = gr;
  if (glow > 0) { g.shadowColor = 'rgba(255,46,136,.75)'; g.shadowBlur = 12 * glow; }
  g.fillText(text, 0, 0);
  g.shadowBlur = 0;
  // bevel: dark outer edge, thin white rim on top
  g.lineWidth = Math.max(4, size * 0.034); g.strokeStyle = 'rgba(18,4,38,.92)'; g.strokeText(text, 0, 0);
  g.lineWidth = Math.max(1.4, size * 0.009); g.strokeStyle = 'rgba(255,255,255,.88)'; g.strokeText(text, 0, 0);
  // glint sweep: a star only — a full-height band reads as a tape artifact
  if (glint >= 0 && glint <= 1) {
    const gx = lerp(-w * 0.7, w * 0.7, glint);
    g.save(); g.globalCompositeOperation = 'screen';
    star4(g, gx, -size * 0.18, 58, 0.55 * alpha, 0.2);
    const lg = g.createLinearGradient(gx - 150, 0, gx + 150, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, `rgba(255,255,255,${0.22 * alpha})`); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.fillRect(gx - 150, -size * 0.16, 300, size * 0.032);
    g.restore();
  }
  g.restore();
}

function scrim(g, cx, cy, r, a) {
  if (a <= 0.001) return;

  rg.addColorStop(1, 'rgba(2,0,8,0)');
  g.save(); g.fillStyle = rg; g.fillRect(cx - r, cy - r, r * 2, r * 2); g.restore();
}

function drawGlobe(g, cx, cy, r, t) {
  g.save(); g.translate(cx, cy);
  g.strokeStyle = 'rgba(33,230,255,.55)'; g.lineWidth = 1.4; g.shadowColor = '#21E6FF'; g.shadowBlur = 10;
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
  const ph = t * 0.55;
  for (let i = 0; i < 4; i++) {
    const a = ph + i * Math.PI / 4;
    g.beginPath(); g.ellipse(0, 0, Math.abs(Math.cos(a)) * r, r, 0, 0, Math.PI * 2); g.stroke();
  }
  for (let i = -2; i <= 2; i++) {
    const yy = i * r * 0.34, rr = Math.sqrt(Math.max(0, 1 - (yy / r) ** 2)) * r;
    g.beginPath(); g.ellipse(0, yy, rr, rr * 0.20, 0, 0, Math.PI * 2); g.stroke();
  }
  g.shadowBlur = 0;
  // four isolated myth nodes, no links
  for (let i = 0; i < 4; i++) {
    const a = ph * 0.3 + i * Math.PI / 2, rr = r * 0.82;

function drawSkull(g, cx, cy, s, glow) {
  g.save(); g.translate(cx, cy); g.scale(s / 100, s / 100);
  const path = new Path2D();

  path.moveTo(-58, -18);
  path.bezierCurveTo(-64, -74, -38, -98, 0, -98);
  path.bezierCurveTo(38, -98, 64, -74, 58, -18);

  path.lineTo(-14, 76); path.quadraticCurveTo(-30, 76, -30, 62);
  path.lineTo(-30, 40); path.bezierCurveTo(-40, 34, -56, 14, -58, -18); path.closePath();

  const e1 = new Path2D(); e1.ellipse(-27, -34, 17, 20, 0.1, 0, Math.PI * 2);
  const e2 = new Path2D(); e2.ellipse(27, -34, 17, 20, -0.1, 0, Math.PI * 2);

  g.beginPath(); g.moveTo(-28, 48); g.lineTo(28, 48); g.stroke();

function drawLoop(g, t) {

    g.beginPath(); g.arc(0, 0, 238, a0, a1);

    g.fillStyle = i ? '#21E6FF' : '#FF2E88'; g.fill(); g.restore();

function drawData(g, t) {

function camAt(t) {
  let a = camPath[0], b = camPath[camPath.length - 1];
  for (let i = 0; i < camPath.length - 1; i++) if (t >= camPath[i].t && t <= camPath[i + 1].t) { a = camPath[i]; b = camPath[i + 1]; break; }
  const k = clamp((t - a.t) / Math.max(1e-4, b.t - a.t));
  const s = eInOutSine(k);
  return { x: lerp(a.x, b.x, s), y: lerp(a.y, b.y, s), z: lerp(a.z, b.z, s), ry: lerp(a.ry, b.ry, s) };
}
const sunPath = [
  { t: 0.0, x: 0, y: 930 }, { t: 6.2, x: 0, y: 880 }, { t: 6.8, x: 0, y: 760 },
  { t: 7.7, x: 0, y: 400 }, { t: 8.6, x: 0, y: 400 },
  { t: 12.8, x: 520, y: 440 }, { t: 15.6, x: 520, y: 460 },
  { t: 16.5, x: -480, y: 450 }, { t: 19.6, x: -480, y: 440 }, { t: 21.2, x: -460, y: 460 },
  { t: 22.5, x: -480, y: 470 }, { t: 27.0, x: -480, y: 470 },
  { t: 27.5, x: 520, y: 560 }, { t: 29.4, x: 520, y: 530 }
];
function sunAt(t) {
  let a = sunPath[0], b = sunPath[sunPath.length - 1];
  for (let i = 0; i < sunPath.length - 1; i++) if (t >= sunPath[i].t && t <= sunPath[i + 1].t) { a = sunPath[i]; b = sunPath[i + 1]; break; }
  const k = clamp((t - a.t) / Math.max(1e-4, b.t - a.t));
  const s = eInOutSine(k);
  return { x: lerp(a.x, b.x, s), y: lerp(a.y, b.y, s) };
}
function kickAt(t) {
  const beats = []; let bt = CUES.beat0;
  while (bt < 30) { beats.push(bt); bt += 60 / CUES.bpm; }
  let amp = 0;
  for (const b of beats) { const u = t - b; if (u >= 0 && u < 0.32) amp = Math.max(amp, Math.exp(-u * 14)); }
  return amp;
}

window.renderAt = async (t) => {
  const fr = Math.round(t * FPS);
  const sc = CUES.scenes;
  const shakeAmp = (t >= 7.7 && t < 8.1) || (t >= 21.1 && t < 21.5) ? 9 * Math.exp(-Math.abs(t - (t >= 21.1 ? 21.2 : 7.7)) * 14) : 0;
  const shx = shakeAmp * (hash1(fr * 7 + 1) - 0.5) * 2, shy = shakeAmp * (hash1(fr * 7 + 2) - 0.5) * 2;
  const p = camAt(t);
  cam.position.set(p.x + shx * 0.02, p.y + shy * 0.02, p.z);
  cam.rotation.set(0, p.ry, 0);

  // sky follows nothing; mountains/sun track camera
  mountFar.position.x = p.x * 0.86; mountFar.position.z = p.z - 1050;
  mountNear.position.x = p.x * 0.93; mountNear.position.z = p.z - 820;

  // sun: keyframed in screen space so it never fights the foreground copy
  const sun = sunAt(t);
  const dist = 950;
  sunMesh.position.set(p.x + sun.x * dist / FPX, p.y - (sun.y - HZ) * dist / FPX, p.z - dist);
  sunMesh.scale.setScalar(lerp(0.92, 0.80, smooth((t - 27.0) / 0.8)));
  const sunBoost = ((t >= 7.6 && t < 8.7) || t >= 27.4) ? 1.28 : 0.92;
  sunMesh.material.color.setScalar(sunBoost);
  drawSun((t * 0.035) % 1);

  // grid
  grid.position.z = p.z - 760;
  gridMat.uniforms.uScroll.value = t * 36 + Math.pow(Math.max(0, t - 27), 2) * 22;
  gridMat.uniforms.uGlow.value = 0.85 + 0.35 * kickAt(t) + (t >= 27 ? 0.4 : 0);
  gridMat.uniforms.uCam.value = p.z;

  // palms conveyor
  for (const sp of palms) {
    const u = sp.userData;
    const z = -((u.z0 + t * 21) % 190) - 10;
    sp.position.set(u.x, u.s * 0.48 - 1.0, z);
    const fade = clamp((-z - 62) / 30) * clamp((130 + z) / 44);
    const endFade = t > 26.6 ? lerp(1, 0.22, clamp((t - 26.6) / 1.2)) : 1;
    sp.material.opacity = fade * endFade * (t < 1.1 ? 0.65 : 1);
    sp.visible = fade > 0.01;
  }

  // helix
  const hIn = t >= 16.46 && t < 22.4;
  helix.visible = hIn;
  if (hIn) {
    const riseK = clamp((t - 16.46) / 2.2);
    const pushK = clamp((t - 18.8) / 2.3);
    helix.position.set(0, lerp(-10.5, 4.0, eOutCubic(riseK)) + pushK * 0.4, -34);
    helix.scale.setScalar(lerp(0.55, 0.88, eOutCubic(riseK)) * lerp(1.0, 1.12, eOutCubic(pushK)));
    helix.rotation.y = t * (0.55 + pushK * 1.8);
    helix.rotation.z = 0.10 * Math.sin(t * 0.7);
  }

  drawOverlay(t);
  const mask = t < sc.mask_open[0] ? 0 : eOutExpo((t - sc.mask_open[0]) / (sc.mask_open[1] - sc.mask_open[0]));
  drawOSD(t, mask);

  // VHS uniforms
  const V = vhs.uniforms;
  V.uFrame.value = fr; V.uMask.value = mask;
  V.uTrack.value = t < 1.1 ? (.72 + .22 * Math.sin(t * 9)) : Math.max(.65 * Math.exp(-(t - 1.1) * 9), 0);
  const hits = [7.7, 12.82, 15.58, 21.2, 27.5];
  for (const h of hits) { const u = t - h; if (u >= 0 && u < 0.22) V.uTrack.value = Math.max(V.uTrack.value, 0.55 * Math.exp(-u * 10)); }
  if (t >= sc.tape_stop) V.uTrack.value = Math.max(V.uTrack.value, 0.35 + 1.2 * smooth((t - sc.tape_stop) / 0.5));
  V.uStatic.value = t < 1.0 ? clamp(.40 - .30 * t + .12 * (hash1(fr + 500) - .5)) : (t >= sc.tape_stop ? .05 : 0);
  let glv = 0, gseed = 0;
  for (const gt of [0.37, 0.63, 1.53, 2.47, 3.23, 6.07, 9.37, 15.58, 21.22, 27.52]) {
    const g0 = Math.round(gt * FPS); if (fr >= g0 && fr < g0 + 2) { glv = 1; gseed = gt * 13.7 + fr; }
  }
  if (t >= 15.58 && t < 16.46 && fr % 3 === 0) { glv = 0.9; gseed = fr * 3.1; }
  if (t >= sc.tape_stop && t < sc.tape_stop + 0.3) { glv = 1; gseed = fr * 5.3; }
  V.uGlitch.value = glv; V.uGSeed.value = gseed;
  V.uSplit.value = t < 1.2 ? 1 : t < 1.5 ? 1 - smooth((t - 1.2) / .3) : (glv > 0 ? 1 : 0);
  V.uVSlip.value = fr === Math.round(3.23 * FPS) ? 12 : (fr === Math.round(sc.tape_stop * FPS) ? -12 : 0);
  const crt = t >= sc.crt_off[0] ? (() => {
    const u = clamp((t - sc.crt_off[0]) / (sc.crt_off[1] - sc.crt_off[0]));
    if (u < 0.35) return [1, lerp(1, 0.002, smooth(u / 0.35)), 0.05, 0];
    if (u < 0.72) return [lerp(1, 0.006, smooth((u - 0.35) / 0.37)), 0.002, 1.0, 0.02];
    return [lerp(0.006, 0.0, smooth((u - 0.72) / 0.28)), 0.002, 0.6, 0.02];
  })() : [1, 1, 0, 0];
  V.uCrtX.value = crt[0]; V.uCrtY.value = crt[1]; V.uCrtG.value = crt[2]; V.uCrtA.value = crt[3];
  V.uFlash.value = (t >= 7.7 && t < 7.78) ? 0.32 * (1 - (t - 7.7) / 0.08) : (t >= 21.2 && t < 21.28) ? 0.26 * (1 - (t - 21.2) / 0.08) : 0;
  V.uDim.value = (t >= 15.38 && t < 15.58) ? lerp(1, 0.55, smooth((t - 15.38) / 0.2)) : (t >= 21.0 && t < 21.2) ? lerp(1, 0.7, smooth((t - 21.0) / 0.2)) : 1;
  V.uShake.value.set(shx, shy);
  bloom.strength = 0.40 + 0.10 * kickAt(t) + ((t >= 7.7 && t < 8.0) || (t >= 21.2 && t < 21.5) ? 0.18 * Math.exp(-Math.abs(t - (t >= 21.2 ? 21.2 : 7.7)) * 8) : 0);
  bloom.enabled = true;

  composer.render(0);
  renderer.getContext().finish();
};

// warm up fonts and the first frame
await document.fonts.load(`900 100px ${FONT_CN}`);
await document.fonts.ready;
drawSun(0);
await window.renderAt(0);
window.__ready = true;
</script>
</body></html>

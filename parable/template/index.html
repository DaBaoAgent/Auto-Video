<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>阿努纳奇 · 第一段 · 火柴人寓言（角色重制）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/900.css">
<style>html,body{margin:0;background:#000}#stage{position:relative;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script src="assets/manifest.js"></script>
<script src="timeline.js"></script>
<script src="lib/core.js"></script>
<script src="lib/promo.js"></script>
<script src="lib/parable.js"></script>
</head><body><div id="stage"></div><script>
// 阿努纳奇 · 第一段 · 3D 火柴人寓言（角色重制）：左＝西琴（写书、举书、卖书、被打脸），
// 中＝人（被捏出来、下矿、拿起剪刀），右＝外星人（坐飞船来、挖金矿、造人、后退）。
// 每个动作都对到口播稿的字（T.word）；固定机位，无切镜。
PROMO.compose({
  bpm: 100, offset: 0, grain: false, tail: 1.4,
  theme: { bg: '#000', fg: '#F2F2F0', ink: '#F2F2F0', muted: '#8C8C88', accent: '#E3262B', paper: '#000', fonts: { display: '"Noto Sans SC", sans-serif', sans: '"Noto Sans SC", sans-serif' } },
  build: async (F) => {
    const T = F.T, s = T.start, e = T.end, Wd = T.word;
    const P = await PROMO.parable(F, { palette: 'void', boxPortrait: { y0: -1.6 } });
    const a1 = s('l1'), a2 = s('l2'), a3 = s('l3'), a4 = s('l4'), a5 = s('l5'), a6 = s('l6'), a7 = s('l7'), a8 = s('l8'), fin = F.duration;
    const w = (id, p, n) => Wd(id, p, n);

    /* ---------- word anchors ---------- */
    const tBook = w('l1', '书'), tEarth = w('l1', '地球'), tAlienW = w('l1', '外星人'), tGold = w('l1', '金矿');
    const tThey = w('l2', '他们来了'), tDig = w('l2', '挖金子'), tTired = w('l2', '挖烦了'), tGene = w('l2', '基因'), tApe = w('l2', '猿猴'), tStir = w('l2', '搅在一起');
    const tPinch = w('l2', '捏'), tNew = w('l2', '新物种'), tWork = w('l2', '替他们'), tDown = w('l2', '下矿');
    const tShip = w('l4', '这本书'), tSell = w('l4', '卖'), tMillion = w('l4', '几百万册');
    const tTrans = w('l4', '翻译成'), tLang = w('l4', '语言'), tWorld = w('l4', '全世界'), tBillion = w('l4', '几十亿人'), tBelieve = w('l4', '信过');
    const tAcad = w('l5', '可学术界'), tSneer = w('l5', '冷笑'), tPseudo = w('l5', '伪学术'), tTablet = w('l5', '楔形文字'), tWrong = w('l5', '翻译错了');
    const tIronic = w('l6', '最讽刺');
    const tForty = w('l7', '四十年后'), tHuman7 = w('l7', '人类'), tTake = w('l7', '拿起'), tScissor = w('l7', '剪刀');
    const tOnly = w('l8', '只不过'), tPinchUs = w('l8', '捏'), tNotAlien = w('l8', '不是外星人'), tBacteria = w('l8', '细菌');

    const THREE = P.THREE;
    const CLAY = 0xD9C6A2, CLAY2 = 0xB8A177, CREAM = 0xEFE7D6, GOLD = 0xE7B748, RED = 0xE3262B, DARK = 0x2A2622, WOOD = 0x8A6A45;
    const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.rough ?? 0.62, metalness: o.metal ?? 0.02, emissive: c, emissiveIntensity: o.ei ?? 0, transparent: o.opacity !== undefined, opacity: o.opacity ?? 1, depthWrite: o.opacity === undefined, side: o.side ?? THREE.FrontSide });
    const mesh = (g, geo, c, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, o) => { const m = new THREE.Mesh(geo, mat(c, o)); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };
    const anims = [];
    const prop = (g, at, p, fn, o = {}) => { const it = P.item(g, o); it.at(at, p); if (fn) anims.push(fn); return it; };
    const clamp01 = (q) => Math.max(0, Math.min(1, q));

    /* ---------- 1 · the three roles ---------- */
    const sitchin = P.figure('sitchin', { x: -1.35, z: -0.25, face: 'camera' });
    const hum = P.figure('hum', { x: 0.1, z: -0.3, face: 'camera', scale: 0.82 });
    hum.appear(10.0);
    const alien = P.figure('alien', { x: 1.55, z: -0.35, face: 'camera', scale: 1.05 });
    alien.appear(5.35);
    /* 身份随场景走：名字、身份、动作一起变 */
    const LB = (fg, text, at, until) => P.label(fg, text, { at, until, y: 1.9, follow: true, size: 34 });
    LB(sitchin, '西琴', 1.0, 13.1);
    LB(sitchin, '畅销书作者', 13.15, 17.3);
    LB(sitchin, '伪学术作者', 17.36, 22.1);
    LB(sitchin, '西琴', 22.15, 27.0);
    LB(alien, '外星人', 5.45, 5.95);
    LB(alien, '矿工', 5.96, 7.60);
    LB(alien, '造物者', 7.64, 10.30);
    LB(alien, '外星人', 10.35, 28.3);
    LB(hum, '新物种', 10.05, 12.90);
    LB(hum, '人', 12.95, 24.15);
    LB(hum, '人类', 24.20, 28.0);

    /* ---------- 2 · desk, book, tablet (left) ---------- */
    const desk = new THREE.Group();
    mesh(desk, new THREE.BoxGeometry(0.86, 0.07, 0.52), WOOD, 0, 0.82, 0.15);
    for (const [dx, dz] of [[-0.35, 0.37], [0.35, 0.37], [-0.35, -0.02], [0.35, -0.02]]) mesh(desk, new THREE.BoxGeometry(0.055, 0.8, 0.055), 0x6B4F33, dx, 0.41, dz);
    prop(desk, 0.55, [-1.35, 0, 0]);

    const book = new THREE.Group();
    for (const sx of [-1, 1]) {
      mesh(book, new THREE.BoxGeometry(0.26, 0.38, 0.028), 0x9A7B52, sx * 0.13, 0, -0.02);
      mesh(book, new THREE.BoxGeometry(0.225, 0.34, 0.02), CREAM, sx * 0.115, 0, 0.03);
      for (let i = 0; i < 4; i++) mesh(book, new THREE.BoxGeometry(0.17, 0.007, 0.004), 0x7A6A52, sx * 0.12, 0.105 - i * 0.065, 0.042);
    }
    mesh(book, new THREE.BoxGeometry(0.035, 0.39, 0.035), CLAY, 0, 0, 0);
    const bookIt = P.item(book, { face: 'camera' });
    bookIt.at(0.55, [-1.4, 0.92, 0.12]);
    bookIt.hold(sitchin, tBook - 0.4, tWrong, { hand: 'both' });
    bookIt.at(tWrong, [-1.78, 0.22, 0.3], { dur: 0.3 });
    bookIt.at(28.5, [-1.4, 0.92, 0.12], { dur: 0.3 });
    anims.push((t) => { book.rotation.x = (t > tWrong && t < 28.5) ? -1.25 : 0; book.rotation.y = t > tWrong ? 0 : 0.16; });

    // cuneiform tablet: marks + red X
    const tab = new THREE.Group();
    mesh(tab, new THREE.BoxGeometry(0.42, 0.52, 0.035), 0xC8B58F, 0, 0, 0);
    const signs = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const sg = new THREE.Group(); sg.position.set(-0.14 + c * 0.095, 0.16 - r * 0.105, 0.02); tab.add(sg); signs.push(sg);
      mesh(sg, new THREE.BoxGeometry(0.045, 0.011, 0.006), 0x5A4A36, 0, 0.008, 0);
      mesh(sg, new THREE.BoxGeometry(0.035, 0.009, 0.006), 0x5A4A36, 0, -0.008, 0);
    }
    const xmark = new THREE.Group(); tab.add(xmark); xmark.position.z = 0.03;
    mesh(xmark, new THREE.BoxGeometry(0.56, 0.035, 0.01), RED, 0, 0, 0, 0, 0, 0.78);
    mesh(xmark, new THREE.BoxGeometry(0.56, 0.035, 0.01), RED, 0, 0, 0, 0, 0, -0.78);
    xmark.scale.setScalar(0.001);
    const tabIt = P.item(tab, {});
    tabIt.at(0.55, [-1.76, 0.9, 0.18]);
    tabIt.at(tTablet - 0.1, [-1.72, 1.32, 0.36], { dur: 0.5 });
    anims.push((t) => {
      xmark.scale.setScalar(t > tWrong - 0.3 ? Math.min(1, (t - tWrong + 0.3) / 0.3) : 0.001);
      tab.rotation.z = (t > tSneer && t < tWrong + 0.5) ? Math.sin(t * 18) * 0.02 : 0;
      for (let i = 0; i < signs.length; i++) signs[i].position.x += 0; // keep positions
      tab.rotation.y = t > tWrong ? 0.15 : 0;
    });

    // the “伪学术” stamp
    const stamp = new THREE.Group();
    mesh(stamp, new THREE.BoxGeometry(0.4, 0.28, 0.07), 0x3A3128, 0, 0, 0);
    mesh(stamp, new THREE.BoxGeometry(0.44, 0.05, 0.09), 0x2A241D, 0, 0.16, 0);
    const stampIt = P.item(stamp, {});
    stampIt.at(tSneer, [-1.12, 2.5, 0.32]);
    stampIt.at(tPseudo, [-1.12, 1.05, 0.32], { dur: 0.16 });
    stampIt.at(tPseudo + 1.0, [-1.12, 2.45, 0.32], { dur: 0.4 });
    stampIt.at(21.2, null);
    anims.push((t) => { stamp.rotation.z = (t > tPseudo && t < tPseudo + 0.18) ? 0.06 : 0; });

    // book piles (a few million copies)
    const bookGeo = new THREE.BoxGeometry(0.4, 0.055, 0.3, 1, 1, 1);
    const BStacks = [];
    for (const [x0, z0] of [[-1.78, 0.55], [-0.88, 0.55]]) {
      const slots = [], times = [];
      for (let i = 0; i < 10; i++) { slots.push({ x: x0, y: 0.03 + i * 0.058, z: z0, w: 0.4, h: 0.055, d: 0.3, ry: i % 2 ? 0.12 : -0.08, color: i % 3 === 0 ? 'block' : i % 3 === 1 ? 'brick' : 'wood', geo: bookGeo }); times.push(tMillion + 0.05 + i * 0.075); }
      BStacks.push(P.stack({ slots, times, x: x0, z: z0, depth: 0.3, sound: 'place' }));
    }

    /* ---------- 3 · globe, saucer, mine, pickaxe ---------- */
    const globe = new THREE.Group();
    const globeMat = mat(0xBFAE8E, { rough: 0.82 });
    globe.add(new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 24), globeMat));
    const goldMat = new THREE.MeshStandardMaterial({ color: GOLD, roughness: 0.35, metalness: 0.55, emissive: GOLD, emissiveIntensity: 0.06 });
    const goldBits = [];
    for (let i = 0; i < 12; i++) {
      const a = i * 2.4, b = (i * 0.83) % Math.PI - Math.PI / 2;
      const v = new THREE.Vector3(Math.cos(a) * Math.cos(b), Math.sin(b), Math.sin(a) * Math.cos(b)).multiplyScalar(0.455);
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.045 + (i % 3) * 0.012, 10, 8), goldMat); m.position.copy(v); globe.add(m); goldBits.push(m);
    }
    const dots = [];
    const dotMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5, emissive: 0xFFFFFF, emissiveIntensity: 1.5 });
    for (let i = 0; i < 56; i++) {
      const a = i * 2.399, b = Math.asin((i / 56) * 2 - 1), r = 0.54;
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), dotMat);
      m.position.set(Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r, Math.sin(a) * Math.cos(b) * r);
      m.userData.t0 = tWorld + (i % 12) * 0.055; m.scale.setScalar(0.001); globe.add(m); dots.push(m);
    }
    const globeIt = prop(globe, tEarth, [0.35, 1.78, -1.85], (t) => {
      globe.rotation.y = t * 0.12;
      goldMat.emissiveIntensity = t > tGold ? 0.45 + 0.12 * Math.sin(t * 3) : 0.06;
      for (const d of dots) { const q = clamp01((t - d.userData.t0) / 0.25); d.scale.setScalar(0.001 + q * (0.75 + 0.25 * Math.sin(t * 3 + d.userData.t0 * 7))); }
    });
    globeIt.at(tForty, null);

    const saucer = new THREE.Group();
    mesh(saucer, new THREE.CylinderGeometry(0.58, 0.46, 0.13, 32), 0xCFC6B8, 0, 0, 0);
    mesh(saucer, new THREE.SphereGeometry(0.24, 24, 16), 0xD9D2C5, 0, 0.12, 0);
    const lightMat = new THREE.MeshStandardMaterial({ color: GOLD, roughness: 0.3, metalness: 0.4, emissive: GOLD, emissiveIntensity: 1.2 });
    const lights = [];
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, m = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), lightMat); m.position.set(Math.cos(a) * 0.52, -0.02, Math.sin(a) * 0.52); saucer.add(m); lights.push(m); }
    const beamMat = new THREE.MeshBasicMaterial({ color: 0xFFF3CC, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const beam = new THREE.Mesh(new THREE.ConeGeometry(0.52, 1.85, 32, 1, true), beamMat); beam.position.y = -0.95; beam.visible = false; saucer.add(beam);
    const saucerIt = prop(saucer, tAlienW - 0.15, [1.42, 3.3, -2.15], (t) => {
      saucer.rotation.y = t * 0.7; lightMat.emissiveIntensity = 0.9 + 0.5 * Math.sin(t * 6);
      beamMat.opacity = 0.13 * clamp01((t - tAlienW + 0.1) / 0.35) * (1 - clamp01((t - tThey - 0.2) / 0.6));
    });
    saucerIt.at(tAlienW - 0.02, [1.42, 1.92, -2.15], { dur: 0.9 });

    const mine = new THREE.Group();
    const rocks = [[-0.28, 0.18, 0, 0.3, 0x6B6256], [0.08, 0.3, -0.1, 0.34, 0x5B5348], [0.34, 0.16, 0.05, 0.24, 0x746A5C], [-0.02, 0.1, 0.18, 0.2, 0x665C50], [0.22, 0.36, -0.02, 0.18, 0x7C7264]];
    for (const [x, y, z, s, c] of rocks) mesh(mine, new THREE.DodecahedronGeometry(s, 0), c, x, y, z, x * 3, y * 5, z * 4);
    const mineGold = new THREE.MeshStandardMaterial({ color: GOLD, roughness: 0.35, metalness: 0.55, emissive: GOLD, emissiveIntensity: 0.4 });
    for (let i = 0; i < 9; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.035 + (i % 3) * 0.01, 8, 8), mineGold); m.position.set(-0.3 + (i * 0.083) % 0.7, 0.1 + (i * 0.13) % 0.38, 0.12 - (i % 2) * 0.18); mine.add(m); }
    prop(mine, 0.6, [1.78, 0, -1.12], (t) => {
      const hit = (tt) => Math.max(0, Math.sin((t - tt) * 42)) * Math.exp(-Math.abs(t - tt) * 7);
      mine.position.x = (hit(6.05) + hit(6.25)) * 0.035;
    });
    const coinTimes = []; for (let i = 0; i < 16; i++) coinTimes.push(tDig + 0.12 + i * 0.035);
    const coinsS = P.coins({ x: 1.42, z: -0.62, n: 16, per: 8, r: 0.085, h: 0.022, times: coinTimes });

    const pick = new THREE.Group();
    mesh(pick, new THREE.CylinderGeometry(0.04, 0.045, 0.78, 10), WOOD, 0, -0.38, 0);
    mesh(pick, new THREE.BoxGeometry(0.42, 0.09, 0.09), 0x6E5A46, 0, -0.75, 0);
    mesh(pick, new THREE.ConeGeometry(0.05, 0.16, 8), 0x6E5A46, -0.2, -0.75, 0, 0, 0, Math.PI / 2);
    mesh(pick, new THREE.ConeGeometry(0.05, 0.16, 8), 0x6E5A46, 0.2, -0.75, 0, 0, 0, -Math.PI / 2);
    const pickIt = P.item(pick, {});
    pickIt.at(0.6, [1.92, 0.08, -0.72]);
    pickIt.hold(alien, 5.94, 6.42, { hand: 'R' });
    pickIt.at(6.42, [1.5, 0.08, -0.3], { dur: 0.2 });
    pickIt.at(tWork + 0.14, [0.62, 1.0, -0.35], { dur: 0.35 });
    pickIt.hold(hum, tWork + 0.28, tDown + 0.55, { hand: 'R' });
    pickIt.at(tDown + 0.55, [0.78, 0.08, -0.55], { dur: 0.2 });

    /* ---------- 4 · gene vat, helix, ape, creation beam ---------- */
    const vat = new THREE.Group();
    mesh(vat, new THREE.CylinderGeometry(0.16, 0.22, 0.52, 18), CLAY, 0, 0.26, 0);
    mesh(vat, new THREE.CylinderGeometry(0.1, 0.16, 0.14, 16), CLAY, 0, 0.58, 0);
    const lid = new THREE.Group(); vat.add(lid);
    mesh(lid, new THREE.CylinderGeometry(0.12, 0.12, 0.06, 18), CLAY2, 0, 0.68, 0);
    mesh(lid, new THREE.SphereGeometry(0.035, 10, 10), CLAY2, 0, 0.72, 0);
    prop(vat, tGene - 0.55, [0.15, 0, -1.12], (t) => {
      const q = Math.max(0, Math.sin(clamp01((t - tPinch) / 0.8) * Math.PI));
      lid.position.y = q * 0.3; lid.rotation.z = q * 0.5;
    });

    const dna = new THREE.Group();
    for (let i = 0; i < 24; i++) { const u = i / 24, y = u * 0.9, a = u * Math.PI * 4; mesh(dna, new THREE.SphereGeometry(0.022, 8, 8), i % 2 ? CLAY : CLAY2, Math.cos(a) * 0.14, y, Math.sin(a) * 0.14); }
    const dnaIt = prop(dna, tGene + 0.1, [0.15, 0.78, -1.12], (t) => { dna.rotation.y = t * 1.1; const big = (t >= 84.24 && t < 98.8) || (t >= 115.57 && t < 132.3); dna.scale.setScalar(big ? 1.7 : 0.9 + 0.1 * Math.sin(t * 4)); });

    const ape = new THREE.Group();
    const aBody = new THREE.Group(); ape.add(aBody);
    mesh(aBody, new THREE.SphereGeometry(0.19, 14, 12), CLAY2, 0, 0.42, 0);
    const aHead = new THREE.Group(); aBody.add(aHead); aHead.position.set(0, 0.66, 0);
    mesh(aHead, new THREE.SphereGeometry(0.14, 14, 12), CLAY2, 0, 0, 0);
    mesh(aHead, new THREE.SphereGeometry(0.075, 10, 10), CLAY, 0.09, -0.04, 0);
    const aArmL = new THREE.Group(), aArmR = new THREE.Group(); aBody.add(aArmL, aArmR);
    aArmL.position.set(-0.16, 0.56, 0); aArmR.position.set(0.16, 0.56, 0);
    mesh(aArmL, new THREE.CylinderGeometry(0.04, 0.035, 0.5, 8), CLAY2, 0, -0.25, 0);
    mesh(aArmR, new THREE.CylinderGeometry(0.04, 0.035, 0.5, 8), CLAY2, 0, -0.25, 0);
    mesh(aBody, new THREE.CylinderGeometry(0.05, 0.04, 0.3, 8), CLAY2, -0.08, 0.16, 0);
    mesh(aBody, new THREE.CylinderGeometry(0.05, 0.04, 0.3, 8), CLAY2, 0.08, 0.16, 0);
    const apeIt = prop(ape, tApe - 0.5, [-0.42, 0, -0.9], (t) => {
      aBody.position.x = Math.sin(t * 0.7) * 0.08;
      aBody.position.y = Math.abs(Math.sin(t * 2.0)) * 0.04;
      aArmL.rotation.x = Math.sin(t * 2.4) * 0.6; aArmR.rotation.x = Math.sin(t * 2.4 + 2) * 0.45;
      aHead.rotation.z = Math.sin(t * 1.0) * 0.14;
    });
    apeIt.at(tStir, [-0.1, 0, -0.95], { dur: 0.6 });

    const beamMat2 = new THREE.MeshBasicMaterial({ color: 0xFFF6DA, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const beam2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.16, 2.1, 20, 1, true), beamMat2); beam2.position.set(0.15, 1.05, -0.95); const beam2G = new THREE.Group(); beam2G.add(beam2); prop(beam2G, tPinch, [0, 0, 0], (t) => { beamMat2.opacity = 0.1 * clamp01((t - tPinch) / 0.2) * (1 - clamp01((t - tNew - 0.45) / 0.5)); });

    /* ---------- 5 · the red scissors, held by the human, with the germ at the hinge ---------- */
    const sci = new THREE.Group(), bl1 = new THREE.Group(), bl2 = new THREE.Group(); sci.add(bl1, bl2);
    for (const [b, sy] of [[bl1, 1], [bl2, -1]]) {
      mesh(b, new THREE.BoxGeometry(1.25, 0.07, 0.06), RED, -0.58, sy * 0.02, 0);
      mesh(b, new THREE.BoxGeometry(0.62, 0.06, 0.05), RED, 0.31, sy * 0.03, 0);
      mesh(b, new THREE.TorusGeometry(0.13, 0.025, 8, 20), RED, 0.66, sy * 0.05, 0);
    }
    mesh(sci, new THREE.SphereGeometry(0.045, 10, 10), CLAY2, 0, 0, 0);
    const sciWrap = new THREE.Group(); sciWrap.add(sci);
    sci.rotation.z = -Math.PI / 2; sci.position.set(0, 0.66, 0); sciWrap.scale.setScalar(0.82);
    const sciIt = P.item(sciWrap, {});
    sciIt.at(tIronic + 0.1, [0.35, 3.15, -0.1]);
    sciIt.at(tIronic + 0.2, [0.35, 1.15, -0.1], { dur: 1.0 });
    sciIt.hold(hum, tTake + 0.2, 29.4, { hand: 'both', dur: 0.05 });
    sciIt.at(28.5, null);

    const germ = new THREE.Group();

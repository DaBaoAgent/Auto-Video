<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#000;}</style></head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="yandi_full_sb.js"></script>
<script>
// ================= 炎帝全片渲染页（密度规则版 + bg10 图片底层）=================
// 规则：文字面积≤30% ｜ 每2秒新动效点 ｜ 同屏≥5运动元素 ｜ 人物居中 ｜ 手机可读
const W=1920,H=1080;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const SB=window.SB;
const COL={bg:'#0E1518',bgA:'#162125',gold:'#E8B84B',goldD:'#9A7524',jade:'#4E9E8A',jadeD:'#173B34',cream:'#F3EAD3',red:'#D9534F',redD:'#8E2F2C',earth:'#8A5A3B',earthD:'#4A2E1D',white:'#FFFFFF',grey:'#7A8288',ink:'#0A0F11'};

// ---------- 资产（炎帝像素Q版 v1，全部1254正方形RGBA） ----------
const PROJECT_ROOT=new URL('../../',location.href);
const AB=new URL('output/007_炎帝/素材_像素Q版_v1/',PROJECT_ROOT).href;
const ASSETS={
 'yandi-front':AB+'人物/炎帝_正面.png','yandi-side':AB+'人物/炎帝_侧面.png','yandi-back':AB+'人物/炎帝_背面.png',
 'farmer':AB+'人物/部落农夫.png','herbw':AB+'人物/采药妇.png',
 'rice':AB+'道具/五谷_稻穗.png','shu':AB+'道具/五谷_黍穗.png','ji':AB+'道具/五谷_稷穗.png','mai':AB+'道具/五谷_麦穗.png','shu2':AB+'道具/五谷_大豆.png',
 'herb':AB+'道具/常用药草.png','tea':AB+'道具/解毒茶枝.png','basket':AB+'道具/采药竹篮.png',
 'leisi':AB+'道具/木制耒耜.png','stone':AB+'道具/医用砭石.png','pot':AB+'道具/储粮陶罐.png','axe':AB+'道具/原始石斧.png',
 'huangdi':AB+'人物/黄帝.png','chiyou':AB+'人物/蚩尤.png','booth':AB+'道具/以物易物摊位.png','skin':AB+'道具/交易兽皮.png',
};
// 精致逼真版素材（ImageGen 生成，品红底抠图 RGBA 1024²）
const AR=new URL('output/007_炎帝/素材_精致逼真_v1/成品图/',PROJECT_ROOT).href;
const REAL={ 'rice2':AR+'米饭.png','baicai':AR+'白菜.png','luobo':AR+'萝卜.png','zhurou':AR+'猪肉.png','yeren':AR+'神农架野人.png','daoshi':AR+'修仙道士.png' };
for(const k in REAL)ASSETS[k]=REAL[k];
const BGIMG=new URL('output/006_女娲/bg10_layeredpeaks.png',PROJECT_ROOT).href;
const IMGS={};let loaded=0;const need=Object.keys(ASSETS).length+1;
function fileUrl(p){return /^file:/.test(p)?p:'file:///'+p.split('/').map(encodeURIComponent).join('/');}
for(const k in ASSETS){const im=new Image();im.onload=()=>{loaded++;};im.onerror=()=>{loaded++;};im.src=fileUrl(ASSETS[k]);IMGS[k]=im;}
const bgIm=new Image();bgIm.onload=()=>{loaded++;};bgIm.onerror=()=>{loaded++;};bgIm.src=fileUrl(BGIMG);
function img(k){return (IMGS[k]&&IMGS[k].complete&&IMGS[k].naturalWidth)?IMGS[k]:null;}
function sprite(k,x,y,h,o){o=o||{};const im=img(k);if(!im)return;ctx.save();
  ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);
  if(o.flip)ctx.scale(-1,1);const s=o.scale||1;ctx.scale(s,s);
  if(o.filter&&ctx.filter!==undefined)ctx.filter=o.filter;
  ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-h/2,-h/2,h,h);ctx.restore();
  QC.fgRects.push([x-h/2,y-h/2,h,h]);}

// ---------- QC 仪表 ----------
const QC={moving:new Set(),acts:[],textRects:[],subRect:null,fgRects:[]};
function mv(id){QC.moving.add(id);}
function act(id){QC.acts.push(id);}
function tRect(x,y,w,h){QC.textRects.push([x,y,w,h]);}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function eob(t){if(t<=0)return 0;const c=1.70158;const x=t-1;return 1+(c+1)*x*x*x+c*x*x}
function eoe(t){return t>=1?1:1-Math.pow(2,-10*t)}
function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function rnd(seed){const x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// ---------- 背景四层（bg10 图片底层 + 三层动态） ----------
let theme={r:232,g:184,b:75,a:0.10}; // A暖金 → B玉绿
// bg10 运镜：横移与推拉交替，缓慢正弦（半周期13-26s），zoom 基线 1.09 保证平移不出界
function camAt(t){
  const panX=Math.sin(t*Math.PI/26)*42;                    // 左右横移全周期52s
  const panY=Math.sin(t*Math.PI/47+1.2)*14;                // 纵向微漂
  const zoom=1.09+Math.cos(t*Math.PI/19)*0.03;             // 推拉全周期38s（与横移错拍交替）
  return {panX,panY,zoom};
}
function bgBase(t){ // 层1：bg10 aspect-fill 居中裁切 + 缓慢运镜
  if(bgIm.complete&&bgIm.naturalWidth){
    const ir=bgIm.naturalWidth/bgIm.naturalHeight,rr=W/H;
    let sw,sh,sx,sy;
    if(ir>rr){sh=bgIm.naturalHeight;sw=sh*rr;sx=(bgIm.naturalWidth-sw)/2;sy=0;}
    else{sw=bgIm.naturalWidth;sh=sw/rr;sx=0;sy=(bgIm.naturalHeight-sh)/2;}
    const c=camAt(t),m=(c.zoom-1)/2;
    const ox=clamp(c.panX,-W*m,W*m),oy=clamp(c.panY,-H*m,H*m);
    ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(c.zoom,c.zoom);ctx.translate(-W/2,-H/2);
    ctx.drawImage(bgIm,sx,sy,sw,sh,0,0,W,H);ctx.restore();
    mv('bg-cam');
  }else{ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);}
}
function bgParticles(t){ // 层2：微动氛围
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<44;i++){const px=(rnd(i)*W+t*(14+rnd(i+7)*26))%W;const py=(rnd(i+3)*H+t*(8+rnd(i+11)*18))%H;
    const s=1+rnd(i+5)*2.4;ctx.fillRect(px,py,s,s);}
  mv('bg-particles');
}
function bgTheme(t){ // 层3：主题色脉冲
  const pulse=0.75+0.25*Math.sin(t*0.8);
  ctx.fillStyle='rgba('+theme.r+','+theme.g+','+theme.b+','+(theme.a*pulse).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  mv('bg-theme');
}
function bgStage(t,stage){ // 层4：动态舞台（近景山脊+地面，避让924px字幕线）
  const sp=stage==='b'?1:0.55;
  for(let L=0;L<2;L++){
    const amp=36+L*24,yb=H*(L===0?0.80:0.90),spd=(L===0?9:22)*sp;
    ctx.fillStyle=L===0?'rgba(23,59,52,0.45)':'rgba(10,15,17,0.85)';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=24){const y=yb+Math.sin((x+t*spd)*0.0016+L*2.1)*amp+Math.sin((x+t*spd*0.6)*0.004+L)*amp*0.35;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  }
  if(stage==='b'){ // 田垄地面（B段）
    ctx.fillStyle='rgba(74,46,29,0.45)';ctx.fillRect(0,H-150,W,150);
    ctx.strokeStyle='rgba(138,90,59,0.4)';ctx.lineWidth=5;
    for(let i=0;i<5;i++){const yy=H-140+i*24;ctx.beginPath();
      for(let x=0;x<=W;x+=32){ctx.lineTo(x,yy+Math.sin(x*0.01+t*(2+i*0.4)+i)*4);}ctx.stroke();}
    mv('furrows');
  }
  mv('bg-stage');
}

// ---------- 文字 ----------
function bigText(text,x,y,size,color,outline,rot,scale,align){
  if(typeof text!=='string'){window.__badText=(window.__badText||[]);if(window.__badText.length<10)window.__badText.push(String(text));text=String(text);}
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(scale)ctx.scale(scale,scale);
  ctx.font='900 '+size+'px "Microsoft YaHei"';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  const tw=ctx.measureText(text).width;
  const ax=align==='left'?0:(align==='right'?-tw/2:0);
  if(outline){ctx.lineWidth=size*0.12;ctx.strokeStyle=outline;ctx.lineJoin='round';ctx.strokeText(text,ax,0);}
  ctx.fillStyle=color;ctx.fillText(text,ax,0);ctx.restore();
  tRect(x-(align==='left'?0:tw/2)-size*0.1,y-size*0.62,tw+size*0.2,size*1.24);
}
// ---------- 字幕（炎帝样式：底部条 + 关键词金色高亮） ----------
const ACC_KEYS=['炎帝','神农氏','神农','尝百草','七十二','茶','中药','野人','道士','神话','四件事','种地','种子','五谷','能吃','发现'];
function subBar(text){
  ctx.save();
  ctx.font='900 64px "Microsoft YaHei"';
  const tw=ctx.measureText(text).width;
  const bx=W/2-tw/2-38,by=H-156,bw=tw+76,bh=100;
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=COL.gold;ctx.fillRect(bx,by,7,bh);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=9;ctx.strokeStyle='#000';
  const acc=ACC_KEYS.find(k=>text.includes(k));
  let x=W/2-tw/2;
  for(const chr of text){
    const w=ctx.measureText(chr).width;
    const inAcc=acc&&acc.includes(chr);
    ctx.strokeText(chr,x+w/2,by+bh/2+3);
    ctx.fillStyle=inAcc?COL.gold:'#fff';
    ctx.fillText(chr,x+w/2,by+bh/2+3);
    x+=w;
  }
  ctx.restore();
  QC.subRect=[bx,by,bw,bh];tRect(bx,by,bw,bh);
}
function card(x,y,w,h,o){o=o||{};ctx.save();
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);const s=o.scale||1;ctx.scale(s,s);
  ctx.fillStyle=o.fill||'rgba(255,255,255,0.055)';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.fill();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||3;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,o.r||24);ctx.stroke();}
  ctx.restore();
  if(!o.noQC)QC.fgRects.push([x-w/2,y-h/2,w,h]);}
function chip(x,y,text,color,t0,t,size){const p=eob(clamp((t-t0)/0.35,0,1));if(p<=0)return;
  ctx.save();ctx.font='900 '+(size||52)+'px "Microsoft YaHei"';const tw=ctx.measureText(text).width;
  card(x,y,tw+56,size+34,{stroke:color,lw:3,scale:p,fill:'rgba(255,255,255,0.07)'});
  bigText(text,x,y,size||52,color,null,0,p);mv('chip-'+text+t0);ctx.restore();}
function glow(x,y,r,color,a){ctx.save();const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color.replace('A',a.toFixed(3)));g.addColorStop(1,color.replace('A','0'));
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}

// ---------- 剪影 ----------
function glowRim(x,y,r,t){ // 剪影背后的金色逆光
  const pr=r*(1+0.03*Math.sin(t*2.2));
  ctx.save();const g=ctx.createRadialGradient(x,y,pr*0.2,x,y,pr);
  g.addColorStop(0,'rgba(232,184,75,0.34)');g.addColorStop(1,'rgba(232,184,75,0)');
  ctx.fillStyle=g;ctx.fillRect(x-pr,y-pr,pr*2,pr*2);ctx.restore();mv('rim'+(x|0));
}
function silSprite(k,x,y,h,t,ph,o){o=o||{};glowRim(x,y+h*0.25,h*0.75,t);
  sprite(k,x,y+Math.sin(t*1.4+(ph||0))*6,h,Object.assign({filter:'brightness(0.12)',alpha:0.96},o));mv('sil-'+k+ph);}
// 食物小图标（代码平涂，≥60px）
function foodIcon(kind,x,y,s,t,ph){
  ctx.save();ctx.translate(x,y+Math.sin(t*1.8+ph)*7);ctx.scale(s,s);
  if(kind==='rice'){ctx.fillStyle='#F3EAD3';ctx.beginPath();ctx.arc(0,10,26,0,7);ctx.fill();
    ctx.fillStyle='#8A5A3B';ctx.beginPath();ctx.arc(0,14,26,0,Math.PI);ctx.fill();
    for(let i=0;i<3;i++){ctx.strokeStyle='rgba(255,255,255,'+(0.55-i*0.14)+')';ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-12+i*12,-14);ctx.quadraticCurveTo(-12+i*12+Math.sin(t*4+i)*8,-34,-8+i*12,-52);ctx.stroke();}}
  else if(kind==='veg'){ctx.fillStyle='#4E9E8A';ctx.beginPath();ctx.ellipse(0,0,18,40,0,0,7);ctx.fill();
    ctx.strokeStyle='#4E9E8A';ctx.lineWidth=7;for(let i=-1;i<2;i++){ctx.beginPath();ctx.ellipse(i*16,6,9,30,i*0.5,0,7);ctx.stroke();}}
  else if(kind==='radish'){ctx.fillStyle='#D9534F';ctx.beginPath();ctx.moveTo(0,-30);ctx.quadraticCurveTo(24,-8,16,26);ctx.quadraticCurveTo(0,42,-16,26);ctx.quadraticCurveTo(-24,-8,0,-30);ctx.fill();
    ctx.strokeStyle='#4E9E8A';ctx.lineWidth=6;for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(0,-26);ctx.quadraticCurveTo(i*14,-46,i*20,-58);ctx.stroke();}}
  else if(kind==='meat'){ctx.fillStyle='#8E2F2C';ctx.beginPath();ctx.ellipse(0,4,30,20,-0.3,0,7);ctx.fill();
    ctx.fillStyle='#F3EAD3';ctx.beginPath();ctx.arc(24,-12,9,0,7);ctx.fill();
    ctx.strokeStyle='#F3EAD3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(18,-16);ctx.lineTo(8,-6);ctx.stroke();}
  ctx.restore();mv('food-'+kind+ph);
}
function sprout(x,y,s,p,t){ // 发芽生长（p:0-1）
  if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const st=p<0.45?p/0.45:1,lf=clamp((p-0.45)/0.55,0,1);
  ctx.strokeStyle='#4E9E8A';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-110*st);ctx.stroke();
  for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(0,-70*st);
    ctx.quadraticCurveTo(d*40*lf,-90*st,d*62*lf,(-96-Math.sin(t*2.4)*4)*st*lf);ctx.stroke();}
  ctx.fillStyle='#6FC4AD';ctx.beginPath();ctx.ellipse(0,-116*st,16*lf,10*lf,0,0,7);ctx.fill();
  ctx.restore();mv('sprout'+(x|0));
}

// ---------- 转场（温和） ----------
function dip(t,cut){const dt=t-cut;if(dt>=0&&dt<0.3){const a=Math.sin(Math.PI*dt/0.3);ctx.fillStyle=COL.bg;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function veil(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const a=Math.sin(Math.PI*dt/0.32)*0.30;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softFlash(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.2){const a=Math.sin(Math.PI*dt/0.2)*0.28;ctx.fillStyle=color;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
function softWipe(t,cut,color){const dt=t-cut;if(dt>=0&&dt<0.32){const p=eio(dt/0.32);ctx.fillStyle=color;ctx.globalAlpha=0.5;ctx.fillRect(-140+p*(W+280),0,140,H);ctx.globalAlpha=1;}}
function softIris(t,cut){const dt=t-cut;if(dt>=0&&dt<0.36){const p=eoe(dt/0.36);const r=Math.max(1,1150*p);
  ctx.fillStyle=COL.bg;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,r,0,7);ctx.fill('evenodd');}}
const TRANS_KINDS=['dip','veil','softFlash','softWipe','softIris'];
const TRANS={};let kidx=0;
for(const sc of SB.scenes){if(sc.s<=0)continue;
  if(sc.type==='sil-seed'||sc.type==='sil-plant')TRANS[sc.s.toFixed(3)]=['softIris',null];
  else{const r=TRANS_KINDS[kidx%TRANS_KINDS.length];TRANS[sc.s.toFixed(3)]=[r,COL.gold];kidx++;}}
if(SB.gap)TRANS[SB.gap.s.toFixed(3)]=['softIris',null];

// ---------- 场景 ----------
function sceneByT(t){for(const s of SB.scenes){if(t>=s.s&&t<s.e)return s;}return SB.scenes[SB.scenes.length-1];}
function subAt(t){for(const s of SB.subs){if(t>=s[0]&&t<s[1])return s[2];}return '';}

// S1 食物四卡（精致逼真版：米饭/白菜/萝卜/猪肉实拍风素材）
function scFoodHook(sc,t,tl){
  const defs=[['一碗米饭','rice2',420],['白菜','baicai',786],['萝卜','luobo',1153],['猪肉','zhurou',1520]];
  for(let i=0;i<4;i++){
    const TPS=[0.15,1.70,2.24,2.73];
    const p=eob(clamp((tl-TPS[i])/0.4,0,1));if(p<=0)continue;
    const bob=Math.sin(t*1.6+i*1.7)*8;
    card(defs[i][2],520,320,420,{stroke:COL.gold,scale:p,fill:'rgba(232,184,75,0.07)'});
    sprite(defs[i][1],defs[i][2],470+bob,240,{alpha:0.99});
    bigText(defs[i][0],defs[i][2],672,64,COL.cream,null,0,p);
    mv('fh-card'+i);
  }
  sprite('rice',960,210,190,{alpha:0.92*eob(clamp((tl-0.15)/0.4,0,1)),rot:Math.sin(t*1.1)*0.12});mv('rice-top');
  mv('foodhook');
}
// S2 茶+中药
function scFoodMore(sc,t,tl){
  // 顶部保留前四样小图（精致素材弱化）
  const kinds=['rice2','baicai','luobo','zhurou'];
  for(let i=0;i<4;i++){sprite(kinds[i],330+i*140,140,86,{alpha:0.9});mv('fm-mini'+i);}
  const defs=[['茶','tea',560,COL.jade],['中药','herb',1360,COL.gold]];
  for(let i=0;i<2;i++){
    const TPS2=[0.10,1.09];
    const p=eob(clamp((tl-TPS2[i])/0.4,0,1));if(p<=0)continue;
    const bob=Math.sin(t*1.5+i*2)*9;
    card(defs[i][2],540,400,440,{stroke:defs[i][3],scale:p,fill:'rgba(255,255,255,0.06)'});
    sprite(defs[i][1],defs[i][2],460+bob,250,{alpha:0.98});
    bigText(defs[i][0],defs[i][2],682,72,i===1?COL.gold:COL.jade,null,0,p);
    mv('fm-card'+i);
  }
  mv('foodmore');
}
// S3 大问号
function scQuestion(sc,t,tl){
  const wob=Math.sin(t*3)*0.05;
  bigText('?',960,430,320,COL.red,COL.gold,wob,eob(clamp(tl/0.4,0,1)));mv('qmark');
  const kinds=['rice2','baicai','luobo','zhurou','tea','herb'];
  for(let i=0;i<6;i++){const a=t*0.8+i*1.05,r=430+Math.sin(t*1.2+i)*26;
    sprite(kinds[i],960+Math.cos(a)*r,430+Math.sin(a)*r*0.62,120,{alpha:0.95,rot:Math.sin(t*1.5+i)*0.08});mv('q-orbit'+i);}
  mv('question');
}
// S4 排除野人/道士（精致逼真版素材）
function scExclude(sc,t,tl){
  const defs=[['神农架的野人','yeren',560],['修仙的道士','daoshi',1360]];
  for(let i=0;i<2;i++){
    const p=eob(clamp((tl-0.1-i*0.55)/0.4,0,1));if(p<=0)continue;
    card(defs[i][2],500,460,460,{stroke:COL.grey,scale:p});
    sprite(defs[i][1],defs[i][2],430+bobY(t,i),360,{alpha:0.97});
    bigText(defs[i][0],defs[i][2],690,64,COL.cream,null,0,p);
    const cp=clamp((tl-0.9-i*0.85)/0.25,0,1);
    if(cp>0){ctx.save();ctx.translate(defs[i][2],460);ctx.strokeStyle=COL.red;ctx.lineWidth=16;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-120,-120);ctx.lineTo(-120+240*cp,120);ctx.stroke();
      if(cp>0.6){const q=(cp-0.6)/0.4;ctx.beginPath();ctx.moveTo(120,-120);ctx.lineTo(120-240*q,120);ctx.stroke();}
      ctx.restore();mv('cross'+i);}

      ctx.beginPath();ctx.moveTo(0,-52*f);ctx.quadraticCurveTo(28,-8,20,24);ctx.quadraticCurveTo(0,42,-20,24);ctx.quadraticCurveTo(-28,-8,0,-52*f);ctx.fill();ctx.restore();mv('potfire'+i);}
  }else if(v==='banquan'){
    silSprite('yandi-front',560,590,420,t,1);
    silSprite('huangdi',1360,590,420,t,2);
    const vs=1+0.06*Math.sin(t*4);
    ctx.save();ctx.translate(960,450);ctx.rotate(Math.sin(t*1.2)*0.07);ctx.scale(vs,vs);
    ctx.fillStyle=COL.redD;ctx.beginPath();ctx.roundRect(-105,-64,210,128,20);ctx.fill();ctx.restore();
    bigText('三仗',960,450,84,COL.white,null,Math.sin(t*1.2)*0.07,vs);mv('bq-vs');
    for(let i=0;i<3;i++){const ph=clamp((tl-0.5-i*0.7)/0.5,0,1);if(ph<=0)continue;
      ctx.save();ctx.globalAlpha=0.6*Math.sin(ph*Math.PI);
      ctx.strokeStyle=COL.gold;ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(960,560,140+i*60,0,7);ctx.stroke();ctx.restore();mv('bq-wave'+i);}
  }else if(v==='zhuolu'){
    silSprite('yandi-front',420,600,400,t,1);
    silSprite('huangdi',760,620,380,t,2);
    silSprite('chiyou',1400,600,480,t,3);
    for(let i=0;i<4;i++){const ph=(t*1.1+i*0.25)%1;
      ctx.fillStyle='rgba(217,83,79,'+(0.7*(1-ph)).toFixed(2)+')';
      const ax=860+ph*420;
      ctx.save();ctx.translate(ax,520+Math.sin(i*2)*60-ph*40);ctx.rotate(0.5);
      ctx.fillRect(-16,-3,32,6);ctx.restore();mv('arrow'+i);}
    ctx.save();ctx.fillStyle='rgba(10,15,17,0.9)';ctx.strokeStyle='rgba(232,184,75,0.25)';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(880,830,320,10,4);ctx.fill();ctx.stroke();ctx.restore();mv('z-ground');
  }else if(v==='cave'){
    ctx.save();ctx.fillStyle='rgba(10,15,17,0.92)';ctx.strokeStyle='rgba(232,184,75,0.25)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(480,820,300,Math.PI,0);ctx.lineTo(780,1080);ctx.lineTo(180,1080);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();mv('cave');
    for(let i=0;i<4;i++){const px=340+i*90,py=700+((i%2)*50);
      ctx.save();ctx.translate(px,py+Math.sin(t*1.5+i)*4);
      ctx.strokeStyle='rgba(217,120,79,0.8)';ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(0,-22,10,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,16);ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.stroke();ctx.restore();mv('paint'+i);}
    silSprite('farmer',1280,620,420,t,2);
    sprite('rice',1560,700,190,{alpha:0.92,rot:Math.sin(t*1.2)*0.08});mv('cave-rice');
    sprout(1520,H-165,1.1,clamp((tl-1.0)/1.0,0,1),t);
  }else if(v==='war'){
    silSprite('farmer',620,620,400,t,1);
    silSprite('farmer',1300,620,400,t,2);
    for(let i=0;i<5;i++){const ph=(t*1.2+i*0.2)%1;
      ctx.fillStyle='rgba(217,83,79,'+(0.6*(1-ph)).toFixed(2)+')';
      ctx.save();ctx.translate(760+ph*400,540+Math.sin(i*2.4)*80-ph*60);ctx.rotate(0.4);
      ctx.fillRect(-14,-3,28,6);ctx.restore();mv('war-arrow'+i);}
    bigText('抢',960,330,130,COL.red,COL.bg,Math.sin(t*3)*0.04,clamp((tl-0.3)/0.4,0,1));mv('war-word');
  }
  mv('silv-'+v);
}

// ---------- 主渲染 ----------
function render(t){
  QC.moving.clear();QC.acts=[];QC.textRects=[];QC.subRect=null;QC.fgRects=[];
  ctx.setTransform(1,0,0,1,0,0);
  const inGap=!!(SB.gap&&t>=SB.gap.s&&t<SB.gap.e);
  const sc=inGap?{s:SB.gap.s,e:SB.gap.e,type:'junction'}:sceneByT(t);
  const tl=t-sc.s;
  // 主题色：A暖金（钩子）→ B玉绿（种地），接点处过渡
  const SEG=[[0,232,184,75],[106,138,90,59],[210,78,158,138],[298,232,184,75]];
  let s0=SEG[0],s1=SEG[1];
  for(let i=0;i<SEG.length-1;i++){if(t>=SEG[i][0]&&t<SEG[i+1][0]){s0=SEG[i];s1=SEG[i+1];break;}}
  if(t>=SEG[SEG.length-1][0]){s0=s1=SEG[SEG.length-1];}
  const k=s0===s1?1:clamp((t-s0[0])/(s1[0]-s0[0]),0,1);
  theme.r=s0[1]+(s1[1]-s0[1])*k;theme.g=s0[2]+(s1[2]-s0[2])*k;theme.b=s0[3]+(s1[3]-s0[3])*k;theme.a=0.10;
  bgBase(t);bgParticles(t);bgTheme(t);
  bgStage(t,(t>=32.3&&t<106.4)?'b':'a');
  try{
    ctx.save();
    const name=sc.type;
    if(name==='foodhook')scFoodHook(sc,t,tl);
    else if(name==='foodmore')scFoodMore(sc,t,tl);
    else if(name==='question')scQuestion(sc,t,tl);
    else if(name==='exclude')scExclude(sc,t,tl);
    else if(name==='hero-reveal')scHeroReveal(sc,t,tl);
    else if(name==='caobai-sil')scCaobaiSil(sc,t,tl);
    else if(name==='poison72')scPoison72(sc,t,tl);
    else if(name==='myth')scMyth(sc,t,tl);
    else if(name==='bigger')scBigger(sc,t,tl);
    else if(name==='fourcards')scFourCards(sc,t,tl);
    else if(name==='fourbig')scFourBig(sc,t,tl);
    else if(name==='junction')scJunction(sc,t,tl);
    else if(name==='sil-seed')scSilSeed(sc,t,tl);
    else if(name==='fivegrain')scFiveGrain(sc,t,tl);
    else if(name==='taste')scTaste(sc,t,tl);
    else if(name==='sil-plant')scSilPlant(sc,t,tl);
    else if(name==='junction')scJunction(sc,t,tl);
    else if(name==='chapter')scChapterFull(sc,t,tl);
    else if(name==='endcard')scEndcard(sc,t,tl);
    else{const cfg=TYPE_CFG[name];if(cfg)renderGeneric(cfg,sc,t,tl);}
    ctx.restore();
  }catch(e){window.__err=(window.__err||[]);if(window.__err.length<20)window.__err.push(t.toFixed(2)+': '+String(e));ctx.restore();}
  // 转场
  for(const kk in TRANS){const c=+kk;const dt=t-c;if(dt<0||dt>0.4)continue;
    const ty=TRANS[kk][0],col=TRANS[kk][1];
    if(ty==='dip')dip(t,c);else if(ty==='veil')veil(t,c,col);else if(ty==='softFlash')softFlash(t,c,col);
    else if(ty==='softWipe')softWipe(t,c,col);else if(ty==='softIris')softIris(t,c);}
  // 字幕
  const sub=inGap?'':subAt(t);
  if(sub)subBar(sub);
  // 水印+进度
  ctx.save();ctx.font='500 32px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('@徐艾伦',W-44,34);ctx.restore();
  const pr=clamp(t/SB.total,0,1);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,H-6,W,6);
  ctx.fillStyle=COL.gold;ctx.fillRect(0,H-6,W*pr,6);mv('progress');
  // 淡出
  if(t>SB.total-0.5){ctx.fillStyle='#000';ctx.globalAlpha=(t-(SB.total-0.5))/0.5;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  QC.moving.add('watermark');QC.acts.push('scene:'+sc.type);
  if(sc.s>0)QC.acts.push('cut:'+sc.type);
}
window.__ready=function(){return loaded>=need;};
window.renderFrame=function(i){render(i/30);return {t:i/30,moving:[...QC.moving],acts:QC.acts,textRects:QC.textRects,subRect:QC.subRect,fgRects:QC.fgRects};};
render(0);
</script></body></html>

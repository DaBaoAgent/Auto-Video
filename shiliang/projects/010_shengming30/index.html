  rays.forEach((ln, i) => { const a = i / 12 * Math.PI * 2 + t * .14; const t0 = T('sun_land') + i * F(.6); const u = E.outB(inv(t0, t0 + F(9), t), 2.2);
    if (t < t0) { vis(ln, false); return; } vis(ln, true); const r0 = SUN.r + 26, r1 = r0 + 40 * u;
    ln.setAttribute('x1', SUN.x + Math.cos(a) * r0); ln.setAttribute('y1', SUN.y + Math.sin(a) * r0); ln.setAttribute('x2', SUN.x + Math.cos(a) * r1); ln.setAttribute('y2', SUN.y + Math.sin(a) * r1); });
  CLOUDS.forEach(c => { const u = E.outQt(inv(c.t0, c.t0 + F(26), t)); tf(c.g, lerp(c.from, c.x, u) + (t - c.t0) * 9 * (u > 0 ? 1 : 0), c.y, c.s * (1 + .04 * kick(t, c.t0 + F(20), 2, .5)), c.s); });
  BIRDS.forEach(bd => { const t0 = T('birds') + bd.i * F(3); const u = inv(t0, t0 + F(60), t);
    const x = lerp(-90 - bd.i * 80, 1250 - bd.i * 70, u), y = 250 + bd.i * 38 + 12 * Math.sin(2 * Math.PI * 1.1 * t + bd.i) - 60 * u;
    const a = 32 * Math.sin(2 * Math.PI * 4.2 * t + bd.i * 1.7) - 6; tf(bd.g, x, y, bd.s); tf(bd.wl, 0, 0, 1, 1, a); tf(bd.wr, 0, 0, 1, 1, -a); });
  BLD.forEach((bl, i) => { const [s, k] = pop(t, bl.t0, 2.3, .4, .22); tf(bl.g, bl.cx, GY, 1 / (1 + k), Math.max(s, 0) * (1 + k));
    if (bl.tip) bl.tip.setAttribute('r', 9 * (0.75 + 0.25 * Math.abs(Math.sin(t * 3.2)))); });
  if (HB.aiDot) { const u = inv(T('ai_wake'), T('ai_wake') + 0.3, t); HB.aiDot.setAttribute('r', 0 + 10 * u + 2 * Math.sin(t * 9) * u); }
  lits.forEach(l => { const [s] = pop(t, l.t0, 3, .42); tf(l.g, l.x, l.y, Math.max(s, 0)); });
  TREES.forEach(tr => { const [s, k] = pop(t, tr.t0, 2.8, .38, .2); tf(tr.g, tr.x, GY, Math.max(s, 0) / (1 + k), Math.max(s, 0) * (1 + k), 2.5 * Math.sin(2 * Math.PI * .7 * t + tr.x)); });
  // sky envelope fly-through 3.6-4.3
  { const u = inv(T('envelope_sky'), T('envelope_sky') + 0.7, t); vis(skyEnv, u > 0 && u < 1);
    if (u > 0 && u < 1) { const x = lerp(2060, 1180, E.inQ(u)), y = lerp(360, 420, E.outQ(u)) - 90 * Math.sin(Math.PI * u); tf(skyEnv, x, y, 1, 1, -14 * (1 - u)); } }
  // hero window blind
  const hw = T('blind_up'), bu = E.outC(inv(hw, hw + F(6), t)); blind.setAttribute('height', HW.h * (1 - bu)); vis(blind, bu < 1);
  const [ss] = pop(t, hw, 3, .45); sill.setAttribute('width', (HW.w + 10) * Math.max(ss, 0)); sill.setAttribute('x', HL.x + HW.w / 2 - (HW.w + 10) * Math.max(ss, 0) / 2);
  heroSparks.forEach((ln, i) => { const hs = T('blind_up'); const t0 = hs + F(1 + i); const u = inv(t0, t0 + F(9), t);
    if (t < t0 || u >= 1) { vis(ln, false); return; } vis(ln, true); const cxx = HL.x + HW.w / 2, cyy = HL.y + HW.h / 2;
    const a = [-2.5, -.64, .64, 2.5][i] + (i > 1 ? 0 : 0), ra = lerp(44, 64, E.outC(u)), w = 8 * (1 - u);
    ln.setAttribute('x1', cxx + Math.cos(a) * 40); ln.setAttribute('y1', cyy + Math.sin(a) * 40); ln.setAttribute('x2', cxx + Math.cos(a) * ra); ln.setAttribute('y2', cyy + Math.sin(a) * ra); ln.setAttribute('stroke-width', w); });
}

// ============================================================ INTERIOR UPDATE
function updInterior(t, cam) {
  const tp = T('envelope_land'), ra = T('envelope_open');
  const typing = 1 - inv(tp - 0.4, tp + F(4), t);
  tf(CH, 860, 760, 1, 1, 0);
  // arms: typing, then reach for the envelope, then recoil at 17.5
  const reach = E.outB(inv(ra, ra + F(8), t), 1.6) * (1 - E.outQ(inv(17.35, 17.75, t)));
  armL.sh.setAttribute('transform', `translate(-146 -150) rotate(${14 + 1.5 * Math.sin(2 * Math.PI * 5.5 * t) * typing})`);
  armL.fo.setAttribute('transform', `translate(0 116) rotate(${-98 + 7 * Math.sin(2 * Math.PI * 5.5 * t) * typing})`);
  armR.sh.setAttribute('transform', `translate(146 -150) rotate(${lerp(-14 + 1.5 * Math.sin(2 * Math.PI * 5.5 * t + 2) * typing, -78, reach)})`);
  armR.fo.setAttribute('transform', `translate(0 116) rotate(${lerp(98 + 7 * Math.sin(2 * Math.PI * 5.5 * t + 2) * typing, 26, reach)})`);
  // head: idle typing nod, turn to the envelope at 6.55, snap to the door at 17.5
  const turn = E.outQ(inv(6.55, 6.95, t)) * (1 - E.outQ(inv(8.3, 8.7, t)));
  const nod = typing * 6 * Math.pow(1 - Math.abs(Math.sin(2 * Math.PI * t)), 4);
  tf(neck, 10 * turn, -200 + nod * .4, 1, 1, 5 * turn);
  tf(head, 4 * turn, -86 + nod, 1, 1, 7 * turn);
  const bl = 8.36; const blink = Math.max(hump(inv(bl, bl + F(4), t)), hump(inv(15.9, 15.9 + F(4), t)));
  const wide = t > 17.5 ? 1 + .22 * Math.max(pop(t, 17.5, 3, .4)[0], 0) : 1;
  eyes.forEach(e => tf(e.g, e.x + 9 * turn + 3 * (t > 17.5 ? 1 : 0), 10, wide, wide * (1 - .9 * blink)));
  brows.forEach(b => tf(b, 0, -12 * (t > 17.5 ? 1 : 0)));
  // mouth: polite smile -> small O after the hit, bigger after the AI face
  const got = T('recoil'), scared = T('ai_face');
  vis(smile, !(t > got) && !(t > scared)); vis(oMouth, t > got);
  if (t > got) tf(oMouth, 0, 0, Math.max(1, 1 + 0.3 * Math.max(kick(t, got, 4, .4), 0)), Math.max(1, 1 + 0.3 * Math.max(kick(t, got, 4, .4), 0)));
  // recoil: lean back, shoulders up, chair rocks
  const rec = E.outQ(inv(got, got + F(6), t)) * (1 - .25 * E.outQ(inv(got + 1.2, got + 2.2, t)));
  tf(CH, 860, 760 - 6 * rec, 1 + .01 * rec, 1 - .02 * rec, -4 * rec);
  chairG.setAttribute('transform', `translate(860 770) rotate(${-5 * rec}) translate(-860 -770)`);
  // envelope: lands on the desk, flap opens, letter pops out and grows into the mail panel
  const eu = inv(tp, tp + F(9), t);
  vis(envelope, t >= tp - 0.2 && t < T('mail_wipe') + 0.1);
  if (t >= tp - 0.2) { const [s, k] = pop(t, tp, 2.6, .42, .25);
    tf(envelope, ENV.x, ENV.y + 34 * (1 - Math.min(eu, 1)) + 3 * Math.sin(t * 7) * (1 - inv(tp, tp + 1.2, t)), Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k), 0);
    const fl = E.outB(inv(ra, ra + F(7), t), 1.8); envelope.flap.setAttribute('transform', `translate(0 -70) scale(1 ${Math.max(.001, 1 - .9 * fl)}) translate(0 70)`); }
  // letter grows in the interior, then the mail panel takes over in screen space
  { const u = inv(T('paper_out'), T('mail_wipe') + 0.42, t); vis(letter, u > 0 && u < 1);
    if (u > 0) { const s = lerp(.6, 1.15, E.outB(clamp(u), 1.5)); tf(letter, ENV.x, 700 - 60 * E.outQ(u), s, s, -3 * u); } }
  // wall monitor + AI face
  vis(monitor, t < T('ai_face') + 0.1);
  vis(aiFace, t >= T('ai_face'));
  if (t >= T('ai_face')) { const [s, k] = pop(t, T('ai_face'), 3.2, .45, .2); const sc = Math.max(s, 0);
    aiFace.setAttribute('transform', `translate(${MON.x + MON.w / 2} ${MON.y + MON.h / 2}) scale(${sc / (1 + k)}, ${sc * (1 + k)}) translate(${-(MON.x + MON.w / 2)} ${-(MON.y + MON.h / 2)})`);
    const blinkT = T('ai_blink'); const shut = hump(inv(blinkT, blinkT + F(4), t));
    aiFace.eyeL.setAttribute('height', 16 * (1 - .9 * shut)); aiFace.eyeR.setAttribute('height', 16 * (1 - .9 * shut)); }
  // sweat
  sweat.forEach((g, i) => { const t0 = SC.sweat[i]; const u = inv(t0, t0 + 0.55, t); vis(g, u > 0 && u < 1);
    if (u > 0) { const [s] = pop(t, t0, 3, .5, 0); tf(g, 786 - 170 * E.outQ(u), 470 + 16 * i - 190 * E.outQ(u), Math.max(s, .001)); } });
  // steam
  steam.forEach((p, i) => p.setAttribute('stroke-dashoffset', -((t * 150 + i * 150) % 306)));
}

// ============================================================ MAIL UPDATE
function updMail(t) {
  const on = t >= T('mail_wipe') && t < T('return_wipe') + 0.34;
  vis(MAIL, on); if (!on) return;
  const grow = E.outC(inv(T('mail_wipe'), T('mail_wipe') + 0.42, t));
  const shrink = E.inC(inv(T('return_wipe'), T('return_wipe') + 0.26, t));
  const sc = Math.max(.02, grow * (1 - shrink));
  MAIL.setAttribute('transform', `translate(960 540) scale(${sc}) translate(-960 -540)`);
  vis(clockG, t >= T('clock_1700'));
  if (t >= T('clock_1700')) { const [s, k] = pop(t, T('clock_1700'), 3, .45, .18); clockG.setAttribute('transform', `translate(430 430) scale(${(Math.max(s, .001) / (1 + k)).toFixed(5)} ${(Math.max(s, .001) * (1 + k)).toFixed(5)}) translate(-430 -430)`); }
  // minute hand ticks from 17:00 to 17:01 at 11.82
  { const u = E.outB(inv(T('clock_1701'), T('clock_1701') + F(6), t), 2); const a = 30 * u;
    handM.setAttribute('transform', `rotate(${a} 430 430)`); clockTxt.textContent = t >= T('clock_1701') ? '17:01' : '17:00'; }
  { const [s, k] = pop(t, T('clock_1700') + F(2), 3, .45, .12); tf(clockTxt, 430, 700, Math.max(s, .001)); }
  // file cards
  [{ g: cardA, t0: SC.files_pop[0] }, { g: cardB, t0: SC.files_pop[1] }].forEach(({ g, t0 }) => {
    const [s, k] = pop(t, t0, 2.8, .42, .22); vis(g, t >= t0);
    if (t >= t0) { const fly = E.inC(inv(T('send_arrow') + F(3), T('send_arrow') + 0.5, t)); const x = lerp(960, 1560, fly), y = lerp(g === cardA ? 330 : 660, g === cardA ? 350 : 660, fly);
      tf(g, x, y, Math.max(s, .001) * (1 - fly * .8) / (1 + k), Math.max(s, .001) * (1 - fly * .8) * (1 + k)); } });
  // targets + arrow + stamp
  [tgtA, tgtB].forEach((g, i) => { const t0 = T('send_arrow') + i * F(2); const [s, k] = pop(t, t0, 2.8, .42, .2); vis(g, t >= t0); if (t >= t0) tf(g, i ? 1560 : 1560, i ? 660 : 350, Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k)); });
  { const u = inv(T('send_arrow'), T('send_arrow') + F(8), t); vis(arrow, u > 0 && u < 1);
    if (u > 0) { const [s] = pop(t, T('send_arrow'), 3, .45, 0); tf(arrow, lerp(1240, 1430, E.outC(u)), lerp(470, 400, E.outC(u)), Math.max(s, .001), Math.max(s, .001)); } }
  { const st = T('stamp_send'); const u = inv(st, st + F(6), t); vis(sendG, u > 0);
    if (u > 0) { const [s, k] = pop(t, st, 2.4, .38, .3, .6); tf(sendG, 1480, 845, Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k), -12); } }
}
// the stamp flies back to the room between the mail panel and the interior
function updStamp(t) {
  const a = T('return_wipe') + 0.06, b = T('recoil');
  const on = t >= a && t < b + 0.4;
  vis(stampBack, on); if (!on) return;
  const u = E.inQ(inv(a, b, t));
  const x = lerp(960, 860, u), y = lerp(540, 380, u) - 160 * Math.sin(Math.PI * u);
  const [s, k] = pop(t, b, 3.4, .38, .3); const sc = t >= b ? Math.max(s, .001) : lerp(.35, 1, u);
  tf(stampBack, x, y, sc / (1 + k), sc * (1 + k));
}

// ============================================================ TEST GRID UPDATE
function updTest(t) {
  const on = t >= T('test_wipe') && t < T('result_merge') + 0.55;
  vis(TEST, on); if (!on) return;
  vis(TEST_TITLE, t >= T('test_wipe') + 0.25);
  CARDS.forEach((c, i) => {
    const t0 = c.t0; const [s, k] = pop(t, t0, 2.6, .42, .2);
    const u = E.outC(inv(T('test_wipe'), t0 + 0.3, t));
    const x = lerp(960, c.gx, u), y = lerp(540, c.gy, u);
    vis(c.g, t >= T('test_wipe'));
    const merge = E.inC(inv(T('result_merge'), T('result_merge') + 0.5, t));
    const mx = lerp(x, 960, merge), my = lerp(y, 540, merge), ms = Math.max(s, .001) * (1 - merge);
    tf(c.g, mx, my, Math.max(ms, .001) / (1 + k), Math.max(ms, .001) * (1 + k));
    const bu = E.outC(inv(c.t0 + 0.35, c.t0 + 1.1, t)); c.bar.setAttribute('width', 360 * bu);
    const lu = inv(c.t0 + 0.15, c.t0 + 0.4, t); vis(c.lamp, lu > 0); if (lu > 0) c.lamp.setAttribute('fill', lu < .5 ? C.SU : C.MI);
  });
}

function updResult(t) {
  const on = t >= T('result_merge') + 0.3 && t < T('percent_drop') + 0.5;
  vis(RES, on); if (!on) return;
  const g = E.outC(inv(T('result_merge') + 0.3, T('result_merge') + 0.72, t));
  RES.setAttribute('transform', `translate(960 540) scale(${lerp(.5, 1, g)}) translate(-960 -540)`);
  RES.setAttribute('opacity', String(clamp(g * 1.4)));
  const bg = E.outB(inv(SC.bars_grow[0], SC.bars_grow[0] + 1.3, t), 1.1), tg = E.outB(inv(SC.bars_grow[0] + 0.1, SC.bars_grow[0] + 1.35, t), 1.1);
  barBig.setAttribute('height', 400 * bg); barBig.setAttribute('y', axisY - 400 * bg);
  barTiny.setAttribute('height', 11 * tg); barTiny.setAttribute('y', axisY - 11 * tg);
  const nu = inv(SC.bars_grow[1] - 0.2, SC.bars_grow[1] + 0.15, t); vis(bigNum, nu > 0); vis(tinyNum, nu > 0);
  if (nu > 0) { const [s, k] = pop(t, SC.bars_grow[1] - 0.2, 3, .45, .18); tf(bigNum, 780, 350, Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k)); tf(tinyNum, 1200, 350, Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k)); }
  [bigLab, tinyLab].forEach((x, i) => { const t0 = SC.bars_grow[1]; const [s] = pop(t, t0, 3, .45, 0); vis(x, t >= t0); if (t >= t0) tf(x, i ? 1200 : 780, 836, Math.max(s, .001)); });
}

// ============================================================ FINAL UPDATE
function updFinal(t) {
  const on = t >= SC.percent_drop;
  vis(FIN, on); if (!on) return;
  const w = E.outC(inv(SC.percent_drop, SC.percent_drop + 0.22, t));
  redWipe.setAttribute('y', 1080 - 1080 * w); redWipe.setAttribute('height', 1080 * w);
  const drop = inv(SC.percent_drop, SC.percent_land, t);
  const land = t >= SC.percent_land ? kick(t, SC.percent_land, 3.2, .38) : 0;
  const yy = lerp(-420, 650, E.inQ(drop));
  const breathe = 1 + .006 * Math.sin(2 * Math.PI * .6 * (t - SC.percent_land));
  tf(big55, 960, yy + 60 * land, breathe * (1 + .12 * land), breathe * (1 - .10 * land));
  const su = inv(SC.percent_land + 0.1, SC.percent_land + 0.55, t); vis(sub55, su > 0);
  if (su > 0) { const [s] = pop(t, SC.percent_land + 0.1, 3, .45, 0); tf(sub55, 960, 760 + 30 * (1 - E.outB(clamp(su), 1.2)), Math.max(s, .001)); }
  const lu = inv(SC.logo_in, SC.logo_in + 0.5, t); vis(logoG, lu > 0);
  if (lu > 0) { const [s, k] = pop(t, SC.logo_in, 3, .45, .2); tf(logoG, 150, 950, Math.max(s, .001) / (1 + k), Math.max(s, .001) * (1 + k)); }
  tf(dotEnd, 1810, 160 + 6 * Math.sin(2 * Math.PI * .5 * t), 1 + .04 * Math.sin(2 * Math.PI * 1.2 * t));
}

// ============================================================ CAPTION UPDATE
function updCaptions(t) {
  let cur = null;
  for (const c of CAPS) { if (t >= c.t0 - 0.001 && t < c.t1) { cur = c; break; } }
  vis(CAP, !!cur); if (!cur) return;
  const inn = Math.max(pop(t, cur.t0, 3.2, .45, .18)[0], 0);
  const out = E.inC(inv(cur.t1 - 0.10, cur.t1, t));
  const s = inn * (1 - out);
  if (s <= 0.002) { vis(CAP, false); return; }
  const w = cur.w * (0.55 + 0.45 * s) / 1, h = cur.h * Math.min(1, s * 1.2);
  const cx = 960, cy = 1080 - 96 - cur.h / 2;
  capPill.setAttribute('x', cx - w / 2); capPill.setAttribute('y', cy - h / 2); capPill.setAttribute('width', w); capPill.setAttribute('height', h);
  capTxt.textContent = cur.text; capTxt.setAttribute('y', cy + 16);
  capTxt.setAttribute('opacity', String(clamp(s * 1.6)));
}

// ============================================================ RENDER
window.renderAt = async (t) => {
  const tq = Math.round(t * FPS) / FPS;
  const cam = camera(tq);
  updWorld(tq, cam, t);
  updInterior(tq, cam);
  updMail(tq);
  updStamp(tq);
  updTest(tq);
  updResult(tq);
  updFinal(tq);
  updCaptions(tq);
};
await window.renderAt(0);
window.__ready = true;
</script>

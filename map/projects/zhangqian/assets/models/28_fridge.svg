  <path d="M104 184 L296 184" fill="none" stroke="#2E2924" stroke-width="5"/>
  <!-- 上门把手 -->
  <rect x="272" y="104" width="12" height="54" rx="6" fill="#7FA5A6"/>
  <!-- 下门把手 -->
  <rect x="272" y="216" width="12" height="70" rx="6" fill="#7FA5A6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="冰箱">
<title>冰箱 · 漫画版道具</title>
<g stroke="#2E2924" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

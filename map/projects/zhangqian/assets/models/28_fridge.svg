  <rect x="104" y="48" width="192" height="318" rx="16" fill="#FBF7EE"/>
  <path d="M200 48 L280 48 Q296 48 296 64 L296 350 Q296 366 280 366 L200 366 Z" fill="#E3D9BE" stroke="none"/>

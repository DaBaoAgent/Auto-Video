  <g fill="#B9D2D1" stroke="none" opacity="0.9">
    <circle cx="86" cy="210" r="4"/><circle cx="72" cy="226" r="3"/><circle cx="314" cy="252" r="4"/>
  </g>
</g>
</svg>
